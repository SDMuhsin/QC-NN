# Macro-hook test: synthetic 30 x 30 um block (pnr/test/fake_ram.lef / .lib, not a kit view) between flops.
set d $::env(QC_FLOW)/pnr/test
set P(TOP)        macro_test
set P(NETLIST)    $d/macro_test.v
set P(SDC)        $d/macro_test.sdc
set P(MACRO_LEFS) $d/fake_ram.lef
foreach c {ss tt ff} { set P(MACRO_LIBS_$c) $d/fake_ram.lib }
set P(DIE_AREA)   {0 0 70 70}
set P(CORE_AREA)  {4 4 66 66}
set P(MACRO_PLACE) {{u_ram 20 20 R0}}
set P(MACRO_PIN_LAYER) M4
set P(PDN_V_PITCH) 10.0
set P(PDN_H_PITCH) 10.0
set P(GDS) 0
