# P&R config of the smoke design (flow/tsmc65/smoke, signed 8x8 MAC), synthesized by smoke/run.sh as smoke_mac8.
set P(TOP)        mac8
set P(SYN)        smoke_mac8          ;# synthesis tag under $QC_BUILD/syn (or a run directory)
set P(CORE_UTIL)  0.50
set P(CORE_MARGIN) 4.0
# small block: straps closer than the defaults so that every row sees both strap layers
set P(PDN_V_PITCH) 10.0
set P(PDN_H_PITCH) 10.0
