# KUL cluster for chimera's TARGET_KULCLUSTER slot (replaces the private
# gitlab.tue.nl:es/convolve-private/kulcluster). Public equivalent: SNAX snax_KUL_cluster from
# github.com/KULeuven-MICAS/snax_cluster @ 3575d72, regenerated by hw/kulcluster/gen.sh.
# All design units are prefixed KULCluster_ (top: KULCluster_snax_KUL_cluster_wrapper), so this
# package has no dependencies and cannot clash with chimera's own snitch_cluster/axi/common_cells.
package:
  name: kulcluster

sources:
  # Pickles differ only in how tool `ifdef`s were resolved at pickling time (see gen.sh).
  - target: verilator            # also covers `bender script verilator` (adds synthesis)
    files:
      - generated/kulcluster_vlt.sv
  - target: all(synthesis, not(verilator))
    files:
      - generated/kulcluster_syn.sv
  - target: all(not(verilator), not(synthesis))
    files:
      - generated/kulcluster_sim.sv
