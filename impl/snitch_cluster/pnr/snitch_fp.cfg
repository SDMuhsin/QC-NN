# P&R config of the Snitch FP cluster (impl/snitch_cluster, variant fp): DC netlist fp_p4.0 (4.0 ns at ss),
# 16 TCDM banks qc_sp_1024x64m8 + 4 I-cache data qc_rf_16x128m1 (ARM, views from flow/tsmc65/sram/mc_gen.sh).
#   impl/snitch_cluster/pnr/run.sh pnr [tag]      (flow/tsmc65/pnr/run_pnr.sh snitch_fp.cfg [tag])
# QC_SN_SYN: synthesis run dir or tag (default fp_p4.0 under $QC_BUILD/syn); QC_SN_MACROS: macro views.
set d [file normalize $::env(QC_FLOW)/../../impl/snitch_cluster/pnr]   ;# (info script is empty in OpenROAD)
set P(TOP) snitch_cluster_wrapper
set P(SYN) [expr {[info exists ::env(QC_SN_SYN)] ? $::env(QC_SN_SYN) : "fp_p4.0"}]
set mdir [expr {[info exists ::env(QC_SN_MACROS)] ? $::env(QC_SN_MACROS) : "/tmp/$::env(USER)/qcnn/macros"}]
set P(MACRO_LEFS) {}
foreach c {ss tt ff} { set P(MACRO_LIBS_$c) {} }
array set sn_mcorner {ss ss_0p9v_125c tt tt_1p0v_25c ff ff_1p1v_m40c}
foreach m {qc_sp_1024x64m8 qc_rf_16x128m1} {
    lappend P(MACRO_LEFS) $mdir/$m/$m.lef
    foreach c {ss tt ff} { lappend P(MACRO_LIBS_$c) $mdir/$m/${m}_$sn_mcorner($c)_syn.lib }
}
source $d/macro_place.tcl
set P(PIN_TCL)       $d/pins.tcl
set P(MACRO_PDN_TCL) $d/pdn_macro.tcl
set P(PRE_ROUTE_TCL) $d/pre_route.tcl
# no post-global-route repair (hold repair at global-route parasitics changed little: -1.11 -> -1.04 ns at ss) and no
# antenna repair: repair_antennas crashes on this design (SIGSEGV in odb::dbWireGraph::decode from
# ant::AntennaChecker::findWireRoots, build 2.0-12381), with or without an incremental global route before it;
# check_antennas after detailed routing still reports the violations
set P(ANTENNA_ITER)  0
set P(CORE_UTIL)     0.62         ;# informational (explicit DIE_AREA / CORE_AREA)
set P(PLACE_DENSITY) 0.70
set P(MAX_UTIL)      85
set P(REPAIR_TIMING) 0            ;# timing repair after CTS in pre_route.tcl (bounded TNS effort, own checkpoint)
set P(REPAIR_DESIGN) 0            ;# electrical repair of the violating nets only, pre_cts.tcl
set P(PRE_CTS_TCL)   $d/pre_cts.tcl
set P(TIMING_DRIVEN) 0            ;# timing-driven global placement: 6 reweights of ~8 min each on 1.36M cells; off for run time
set P(GR_ADJUST)     0.25
set P(GDS)           0            ;# no GDS merge (the ARM macros have no GDS view here; DEF is the layout result)
