# P&R config of the KUL cluster (impl/kulcluster): DC netlist kul_w4.2 (kit wire-load model, 4.2 ns at ss), 38 ARM RF macros.
#   flow/tsmc65/pnr/run_pnr.sh impl/kulcluster/pnr/kulcluster.cfg [tag]     (impl/kulcluster/pnr/run.sh pnr)
# QC_KUL_SYN: synthesis run dir (default $QC_BUILD/syn/kul_w4.2); QC_KUL_MACROS: macro views (mc_gen.sh output).
set d [file normalize $::env(QC_FLOW)/../../impl/kulcluster/pnr]   ;# (info script is empty in OpenROAD)
set P(TOP) KULCluster_snax_KUL_cluster_wrapper
set P(SYN) [expr {[info exists ::env(QC_KUL_SYN)] ? $::env(QC_KUL_SYN) : "kul_w4.2"}]
set mdir [expr {[info exists ::env(QC_KUL_MACROS)] ? $::env(QC_KUL_MACROS) : "/tmp/$::env(USER)/qcnn_kulsyn/macros"}]
set P(MACRO_LEFS) {}
foreach c {ss tt ff} { set P(MACRO_LIBS_$c) {} }
array set kul_mcorner {ss ss_0p9v_125c tt tt_1p0v_25c ff ff_1p1v_m40c}
foreach m {kul_rf_512x64m4 kul_rf_128x128m1 kul_rf_128x40m1} {
    lappend P(MACRO_LEFS) $mdir/$m/$m.lef
    foreach c {ss tt ff} { lappend P(MACRO_LIBS_$c) $mdir/$m/${m}_$kul_mcorner($c)_syn.lib }
}
source $d/macro_place.tcl
set P(PIN_TCL)       $d/pins.tcl
set P(MACRO_PDN_TCL) $d/pdn_macro.tcl
set P(POST_GRT_TCL)  $d/post_grt.tcl
set P(CORE_UTIL)     0.584        ;# informational (explicit DIE_AREA / CORE_AREA)
set P(PLACE_DENSITY) 0.70         ;# gpl minimum ~0.6 (cell area + 1-site padding over the free area)
set P(MAX_UTIL)      85
set P(GR_ADJUST)     0.25
set P(TIMING_DRIVEN) 1
# balance the tree across the DC clock gates (3440 ICGs, up to 6.5k sinks each): without it 1.7 ns skew at ss
set P(CTS_ARGS)      -balance_levels
# electrical repair: flow default REPAIR_DESIGN auto (violating nets only)
# timing repair after CTS in post_cts.tcl (hold margin 0, wider legalisation window)
set P(REPAIR_TIMING) 0
set P(PRE_ROUTE_TCL) $d/post_cts.tcl
