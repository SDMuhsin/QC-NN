# P&R config of QC18-ACC v3, improved recipe (run qa3_t5b, results/pnr_v3.md): qa3.cfg (= the v2 recipe) with
#   * a 950-um logic band (QA_BAND, default here 950; qa3.cfg 700): the standard cells fit the band at the placement
#     density 0.6, instead of spilling into the macro-row channels (v3 band 700: 16.6 % of the cell area outside)
#   * CTS sink buffer CKBD4 (TritonCTS otherwise sizes every tree / sink buffer CKBD16)
#   * host-port IO delays relative to the propagated host-register clock (io_ref.tcl)
#   * +0.2 ns hold margin at the macro CLK pins in the post-GRT hold repair (macro_hold.tcl)
#   QA_CFG=qc18acc/pnr/qa3b.cfg qc18acc/pnr/run.sh pnr <tag>      (PrimeTime: QA_IO_REF=1 qc18acc/pnr/run.sh pt <tag>)
if {![info exists ::env(QA_BAND)]} { set ::env(QA_BAND) 950 }
source [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/qa3.cfg
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(QA_IO_REF)     1
set P(QA_MACRO_HOLD) 0.2
