# P&R config of QC18-ACC v4 (top qa_top): DC netlist qa4_w3.3 (kit WLM, 3.3 ns at ss), 57 ARM SRAM / RF macros
# (48 act qa_act_256x128m2, 6 weight, 2 param, 1 descriptor).  Flow settings = the improved recipe of qa3b.cfg
# (results/pnr_v3.md: CTS sink buffer CKBD4, host IO relative to the propagated host-register clock, +0.2 ns macro
# hold margin in the post-GRT hold repair; gpl 512 bins, density 0.6, no antenna repair), floorplan macro_place4.tcl
# (bank columns, ring order, QA_BAND default 1600 um: v4 logic 1.60 MGE = 1.96x v3, whose cells filled the 950-um band).
# The netlist SDC carries set_min_delay 0.4 on the 736 weight / param macro A / D / CEN / WEN pins (impl/v4), so the
# post-CTS / post-GRT hold repair also fixes them before detailed route.
#   QA_CFG=qc18acc/pnr/qa4.cfg qc18acc/pnr/run.sh pnr <tag>      (or QA_V=4; PrimeTime: QA_V=4 QA_IO_REF=1 run.sh pt <tag>)
# QC_QA_SYN: synthesis run dir (default qa4_w3.3).
if {![info exists ::env(QA_BAND)]} { set ::env(QA_BAND) 1600 }
set d [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]
source $d/qa3b.cfg
set P(SYN) [expr {[info exists ::env(QC_QA_SYN)] ? $::env(QC_QA_SYN) : "qa4_w3.3"}]
set P(MACRO_LEFS) {}
foreach c {ss tt ff} { set P(MACRO_LIBS_$c) {} }
foreach m {qa_act_256x128m2 qa_wgt_4096x80m8 qa_par_4096x72m8 qa_dsc_256x32m2} {
    lappend P(MACRO_LEFS) $mdir/$m/$m.lef
    foreach c {ss tt ff} { lappend P(MACRO_LIBS_$c) $mdir/$m/${m}_$qa_mcorner($c)_syn.lib }
}
source $d/macro_place4.tcl
set P(CORE_UTIL)     0.70         ;# informational (explicit DIE_AREA / CORE_AREA; macros 5.46 + logic 2.31 mm2 DC)
