# P&R config of QC18-ACC v2 (top qa_top): DC netlist qa2_w3.3 (kit WLM, 3.3 ns at ss), 33 ARM SRAM / RF macros.
#   qc18acc/pnr/run.sh pnr [tag]     (flow/tsmc65/pnr/run_pnr.sh qc18acc/pnr/qa.cfg <tag>)
# QC_QA_SYN: synthesis run dir (default $QC_BUILD/syn/qa2_w3.3); QC_QA_MACROS: macro views (mc_gen.sh output, QC_MC_OUT).
set d [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]   ;# (info script is empty in OpenROAD)
set P(TOP) qa_top
set P(SYN) [expr {[info exists ::env(QC_QA_SYN)] ? $::env(QC_QA_SYN) : "qa2_w3.3"}]
set mdir [expr {[info exists ::env(QC_QA_MACROS)] ? $::env(QC_QA_MACROS) : "/tmp/$::env(USER)/qcnn/macros"}]
set P(MACRO_LEFS) {}
foreach c {ss tt ff} { set P(MACRO_LIBS_$c) {} }
array set qa_mcorner {ss ss_0p9v_125c tt tt_1p0v_25c ff ff_1p1v_m40c}
foreach m {qa_act_1024x64m8 qa_wgt_4096x80m8 qa_par_4096x72m8 qa_dsc_256x32m2} {
    lappend P(MACRO_LEFS) $mdir/$m/$m.lef
    foreach c {ss tt ff} { lappend P(MACRO_LIBS_$c) $mdir/$m/${m}_$qa_mcorner($c)_syn.lib }
}
source $d/macro_place.tcl
set P(PIN_TCL)       $d/pins.tcl
set P(MACRO_PDN_TCL) $d/pdn_macro.tcl
set P(POST_GRT_TCL)  $d/post_grt.tcl
set P(PRE_ROUTE_TCL) $d/post_cts.tcl
# PDN: M7 straps 2.0 um (0.8 um: no M7-M8 via fits, PDN-0110), M8 mesh in pdn_macro.tcl
set P(PDN_H_W)       2.0
set P(CORE_UTIL)     0.78         ;# informational (explicit DIE_AREA / CORE_AREA; macros 5.55 + logic 0.88 mm2)
set P(PLACE_DENSITY) 0.65
set P(MAX_UTIL)      85
set P(GR_ADJUST)     0.25
set P(TIMING_DRIVEN) 1
# balance the tree across the 1 230 clock gates (1 197 DC register ICGs + 33 macro CKLNQD2)
set P(CTS_ARGS)      -balance_levels
# electrical repair: flow default REPAIR_DESIGN auto (violating nets only); timing repair after CTS in post_cts.tcl
set P(REPAIR_TIMING) 0
