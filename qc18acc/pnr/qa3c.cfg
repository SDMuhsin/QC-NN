# P&R config of QC18-ACC v3, improved recipe + hub padding (results/pnr_v3.md "route convergence"): qa3b.cfg (950-um
# band, CKBD4 sinks, host IO reference, post-GRT macro hold margin) with QA_HUB_PAD (default 1) sites of placement padding on the
# act-buffer / xbar / head hub cells (hub_pad.tcl, hub_post_cts.tcl, hub_post_grt.tcl), which qa3_t5b placed at
# 95-100 % local utilisation.
#   QA_CFG=qc18acc/pnr/qa3c.cfg qc18acc/pnr/run.sh pnr <tag>      (PrimeTime: QA_IO_REF=1 qc18acc/pnr/run.sh pt <tag>)
source [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/qa3b.cfg
set P(PRE_PLACE_TCL) [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/hub_pad.tcl
set P(PRE_ROUTE_TCL) [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/hub_post_cts.tcl
set P(POST_GRT_TCL)  [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/hub_post_grt.tcl
if {![info exists P(QA_HUB_PAD)]} { set P(QA_HUB_PAD) 1 }
