# P&R config of QC18-ACC v4, route-of-record recipe (results/pnr_v4.md): qa4b.cfg (improved recipe, bank-column
# floorplan, structured crossbar placement) +
#   * partial placement blockages (ch_block.tcl): max density 30 % in the channels between the macro rows, 50 % over
#     the 120 um of the logic band next to each act-macro tier
#   * incremental global placement after the place step's DRV repair, at density 0.76, then DRV repair again
#     (xbar_place.tcl, P(QA_GPL_INCR)): no PE-row cluster left at 95-100 % utilisation
#   * the +0.2 ns post-GRT macro hold margin on the weight / param macros only (P(QA_MACRO_HOLD_RE))
#   QA_CFG=qc18acc/pnr/qa4c.cfg qc18acc/pnr/run.sh pnr <tag>    (run qa4_u8: the same values through QC_PNR_SET on qa4b.cfg)
source [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/qa4b.cfg
foreach {k v} {QA_CH_DENS 30 QA_EDGE_DENS 50 QA_EDGE_W 120 QA_GPL_INCR 1 QA_MACRO_HOLD_RE {^u_(wmem|pmem)/}} {
    if {![info exists P($k)]} { set P($k) $v }
}
