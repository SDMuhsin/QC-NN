# P&R config of QC18-ACC v4, route-of-record recipe (results/pnr_v4.md): qa4b.cfg (improved recipe, bank-column
# floorplan, structured crossbar placement) + partial placement blockages (ch_block.tcl): max density 30 % in the
# channels between the macro rows, 50 % over the 120 um of the logic band next to each act-macro tier.
#   QA_CFG=qc18acc/pnr/qa4c.cfg qc18acc/pnr/run.sh pnr <tag>    (run qa4_t4: QC_PNR_SET with the same three values on qa4b.cfg)
source [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/qa4b.cfg
foreach {k v} {QA_CH_DENS 30 QA_EDGE_DENS 50 QA_EDGE_W 120} { if {![info exists P($k)]} { set P($k) $v } }
