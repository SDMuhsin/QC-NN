# P&R config of QC18-ACC v2, improved recipe (run qa_t1b, results/pnr_v3.md section 3): qa.cfg with a 700-um logic
# band (QA_BAND, default here 700; qa.cfg 400), CTS sink buffer CKBD4, host-IO delays relative to the propagated
# host-register clock (io_ref.tcl), +0.2 ns macro hold margin in the post-GRT repair, detailed-route end iteration 24.
#   QA_CFG=qc18acc/pnr/qab.cfg qc18acc/pnr/run.sh pnr <tag>      (PrimeTime: QA_IO_REF=1 qc18acc/pnr/run.sh pt <tag>)
if {![info exists ::env(QA_BAND)]} { set ::env(QA_BAND) 700 }
source [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/qa.cfg
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(QA_IO_REF)     1
set P(QA_MACRO_HOLD) 0.2
set P(DR_END_ITER)   24
