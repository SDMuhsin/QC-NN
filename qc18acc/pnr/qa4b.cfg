# P&R config of QC18-ACC v4 with structured crossbar placement (results/pnr_v4.md section 2): qa4.cfg (improved
# recipe, bank-column floorplan) + xbar_place.tcl (PRE_PLACE_TCL: the 16 x 128 bank-select, stage-A and window
# registers placed FIRM at their bank columns / source-arc centroids / an 8 x 2 grid before global placement) and
# xbar_unfix.tcl (PRE_CTS_TCL: back to PLACED).  Knobs: P(QA_XB_NCOL) 32, P(QA_XB_INSET) 40, P(QA_XB_WX0 / WX1)
# 425 / 2175, P(QA_XB_WYF) 0.32.
#   QA_CFG=qc18acc/pnr/qa4b.cfg qc18acc/pnr/run.sh pnr <tag>
source [file normalize $::env(QC_FLOW)/../../qc18acc/pnr]/qa4.cfg
set P(PRE_PLACE_TCL) $d/xbar_place.tcl
set P(PRE_CTS_TCL)   $d/xbar_unfix.tcl
