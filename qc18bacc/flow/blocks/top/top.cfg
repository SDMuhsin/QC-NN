# P&R config of the chip top qb_chip (flow/tsmc65/pnr/run_pnr.sh design config; one flattened file replacing the
# impl chain r36/top.cfg -> r35/top.cfg -> r14/top14.cfg -> r11/top.cfg -> r5b/chip.cfg + hard/sdc_pnr.tcl).
# Production recipe of r43_a (results/r39.md "W channel" floorplan, r43.md, r46.md):
#   netlist   $QC_BUILD/r35/top_r35.v: hub + act + 8 columns as black boxes, ARM macros, top glue / sequencer
#   views     QB_TOP_ABS (blocks/top/run.sh views): column ring LEF + ETM with its measured insertion arcs (*_ins.lib),
#             hub / act ring LEF + ETM; OpenROAD reads the act ETM copy without output-pin checks (*_or.lib, R46)
#   floor     floorplan/top_fp.py (<run>/mplace.tcl), chip IO pins floorplan/top_pins.tcl, PDN floorplan/top_pdn.tcl +
#             floorplan/pdn_macro.tcl
#   place     place/top_place.tcl (hub keep-out, DPL padding, block-only nets dont_touch, channel-end repeaters)
#   cts       cts/top_cts_pre.tcl (ICG split + sizing, scripted top clock skeleton, TritonCTS on the leaf nets)
#   route     route/top_route_pre.tcl (clock balancing, IO latency, GRT -allow_congestion; no post-CTS repair),
#             GRT + route/top_post_grt.tcl (balancing / repair / antenna at GRT parasitics, db/grt.odb, exit);
#             DR in a fresh process (route/dr.sh)
# Environment (set by blocks/top/run.sh): QB_TOP_ABS, QB_TOP_PERIOD, QB11_INS / QB14_HINS / QB14_AINS, QB15_GADJ_L,
# QB_SYN (DC run whose SDC is copied to <run>/qb_chip_pnr.sdc; unused by the flow).
source [file normalize $::env(QC_FLOW)/../../qc18bacc/flow/common/qb.tcl]
set ::QC_CORNERS tt
set ::QC_PNR_MAX_LAYER M9
set P(TOP) qb_chip
set P(SYN) [qb_env QB_SYN r5b_top]
source $::QBF/common/block_sdc.tcl
set P(NETLIST) $::QC_BUILD/r35/top_r35.v
set P(SDC)     $::QBF/blocks/top/top_sdc.tcl
# block + ARM macro views
set _a $::env(QB_TOP_ABS)
set _mdir /tmp/$::env(USER)/qcnn/macros
array set _mc {ss ss_0p9v_125c tt tt_1p0v_25c ff ff_1p1v_m40c}
set P(MACRO_LEFS) [list $_a/qb_col_blk.lef $_a/qb_hub.lef $_a/qb_act2_blk.lef]
foreach c {ss tt ff} { set P(MACRO_LIBS_$c) [list $_a/qb_col_blk_${c}_ins.lib $_a/qb_hub_$c.lib $_a/qb_act2_blk_${c}_or.lib] }
foreach m {qb_w_204x144m2 qb_s_256x128m1 qb_b_128x128m1 qb_i_128x128m1 qb_p_240x144m2 qb_d_624x80m8 qb_f_3232x128m8} {
    lappend P(MACRO_LEFS) $_mdir/$m/$m.lef
    foreach c {ss tt ff} { lappend P(MACRO_LIBS_$c) $_mdir/$m/${m}_$_mc($c)_syn.lib }
}
# floorplan: die / core / macro placement from <run>/mplace.tcl (floorplan/top_fp.py, written by run.sh fp after init)
set P(MACRO_AUTO) 0
set P(MACRO_HALO) {7.0 7.0}
if {[info exists ::env(QC_PNR_OUT)] && [file exists $::env(QC_PNR_OUT)/mplace.tcl]} { source $::env(QC_PNR_OUT)/mplace.tcl }
set P(PIN_TCL)       $::QBF/floorplan/top_pins.tcl
set P(PDN_TCL)       $::QBF/floorplan/top_pdn.tcl
set P(MACRO_PDN_TCL) $::QBF/floorplan/pdn_macro.tcl
# place; hub keep-out {h w} um (place/top_place.tcl, repair/top_hold.tcl)
set ::QB_HUBHALO {60 860}
set P(PLACE_DENSITY) 0.35
set P(TIMING_DRIVEN) 0
set P(ROUTABILITY_DRIVEN) 0
set P(GPL_ARGS)      {-overflow 0.30 -pad_left 2 -pad_right 2}
set P(PRE_PLACE_TCL) $::QBF/place/top_place.tcl
set P(PLACE_PAD)     0
set P(DPL_ARGS)      {-max_displacement {3000 3000}}
set P(MAX_UTIL)      90
# cts (CTS -insertion_delay with the ETM clock-tree arcs left OpenROAD STA without any clocked path, results/r5b.md 4)
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
set P(PRE_CTS_TCL)   $::QBF/cts/top_cts_pre.tcl
# route (QB_POSTCTS 1 / QB_RT_LOOPS 0: read by route/postcts_grt.tcl, repair/post_cts.tcl)
set ::env(QB_RT_LOOPS) 0
set ::env(QB_POSTCTS) 1
set P(PRE_ROUTE_TCL) $::QBF/route/top_route_pre.tcl
set P(POST_GRT_TCL)  $::QBF/route/top_post_grt.tcl
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     0.25
set P(GR_ITER)       5
set P(ANTENNA_ITER)  0
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   64
set P(DR_ARGS)       {-drc_report_iter_step 1}
set P(DCAP)          0
set P(GDS)           0
# per-layer GRT adjustment QB15_GADJ_L after every uniform set_global_routing_layer_adjustment (R15 / R30)
source $::QBF/route/gadj_layers.tcl
