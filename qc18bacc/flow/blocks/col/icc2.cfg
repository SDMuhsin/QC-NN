# ICC2 config of the column hard block qb_col_blk (flow/icc2/*.tcl; blocks/col/run.sh pnr).  Only design facts:
# netlist + SDC (DC run QB_SYN, P&R period QB_PNR_PERIOD: common/block_sdc.tcl + the IO budget of blocks/col/io_budget.tcl),
# floorplan (die, core margin, pin positions read from the DEF COL_PIN_DEF; PDN = the chip PG grid, floorplan/pg_grid.tcl), routing
# layers (M8 / M9 belong to the chip top).  Environment from blocks/col/col.env via run.sh.
set P(TOP)          $::env(COL_TOP)
set P(SYN)          $::env(QB_SYN)
set P(IO_BUDGET)    $::QBF/blocks/col/io_budget.tcl
# act -> act_o feedthrough: one DC buffer per bit (the 8 abutted columns each re-buffer act), all sized to the one lib cell
# io_budget.tcl QB5_FT (= the act driving cell of the SDC) and dont_touch with their act_o nets (init.tcl, R68)
set P(FEEDTHRU)     {act_o[*]}
source $P(IO_BUDGET)
set P(FEEDTHRU_CELL) [lindex $::QB5_FT 0]
# act_o routed at 2 x minimum spacing (flow/icc2 qb_feedthru_ndr, R74): PrimeTime cannot fix their noise (dont_touch,
# reason V; r73 [M] 3-7 victims, all 343-389 um long).  r73 route [M]: act_o 1.18 m of 9.30 m routed wire; horizontal
# M3 / M5 / M7 use 3.79 m of 17.7 m of tracks (21 %), so even 3 tracks per act_o wire (+2.4 m worst case) fits.
set P(FEEDTHRU_NDR) 2
# act_o load = the next column's act pin = this block's own act[b] net, per bit (io_budget.tcl; flow/icc2 qb_io_load)
set P(IO_LOAD)      {qb5_act_o_caps qb5_act_o_load}
# act[b] input transition = own act_o[b] transition, per bit and scenario (io_budget.tcl; flow/icc2 qb_io_load, R71)
set P(IO_TRAN)      {qb5_act_tran qb5_act_tran_apply qb5_act_tran_diff}
# act_o -min = -(early I/O latency + fastest clock -> Q), after every compute_clock_latency (io_budget.tcl, R78)
set P(IO_MIN)       {qb5_act_o_lat_icc2 qb5_act_o_min_icc2}
# strip: die 390 x 3110 um, core 380 x 3100 um (5-um margin), no macros
set P(DIE)          {{0 0} {390 3110}}
set P(CORE_OFFSET)  5.0
set P(PIN_DEF)      $::env(COL_PIN_DEF)
# PDN: M1 followpin rails + the chip PG grid (floorplan/pg_grid.tcl: M4 / M7 VSS / VDD straps, M7 = the VDD / VSS
# block pins across the die, VSS y 10.0 + 30k, VDD 25.0 + 30k; the top drops M8 straps on them)
set P(LAYERS)       {M2 M7}
# hold-demand density cap (R85, PI decision 1; flow/icc2 common.tcl qb_density_cap, place.tcl): the pin-adjacent register
# banks qbc_pbank_w / qbc_pbank_f, whose port -> AO22 -> flop paths each need one hold cell; r80-r84 [M] local utilisation
# 0.75-0.83 (+-10 um) vs block 0.64 and 37 PT-unfixable (reason D) hold endpoints in u_pbw.  Region and cap are derived
# from the placement (cell bounding box, block utilisation), not set here.
# DISABLED (R86, PI): the R85 cap covered 45 % of the core (bbox-derived), not the targeted measure, and setup degraded;
# off until the local-utilisation measurement (r86.md Q1) is resolved.  Proc kept: icc2/common.tcl qb_density_cap.
# set P(DENSITY_CAP)  {u_core/u_pbw u_core/u_pbf}
