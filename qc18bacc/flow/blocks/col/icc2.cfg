# ICC2 config of the column hard block qb_col_blk (flow/icc2/*.tcl; blocks/col/run.sh pnr).  Only design facts:
# netlist + SDC (DC run QB_SYN, P&R period QB_PNR_PERIOD: common/block_sdc.tcl + the IO budget of blocks/col/io_budget.tcl),
# floorplan (die, core margin, pin positions read from the DEF COL_PIN_DEF; PDN = the chip PG grid, floorplan/pg_grid.tcl), routing
# layers (M8 / M9 belong to the chip top).  Environment from blocks/col/col.env via run.sh.
set P(TOP)          $::env(COL_TOP)
set P(SYN)          $::env(QB_SYN)
set P(IO_BUDGET)    $::QBF/blocks/col/io_budget.tcl
# act -> act_o feedthrough: one DC buffer per bit (the 8 abutted columns each re-buffer act), all sized to the one lib cell
# io_budget.tcl QB5_FT (= the act driving cell of the SDC) and dont_touch with their act_o nets (init.tcl, R68)
set P(FEEDTHRU)     {act_o[*]}
source $P(IO_BUDGET)
set P(FEEDTHRU_CELL) [lindex $::QB5_FT 0]
# act_o routed at 2 x minimum spacing (flow/icc2 qb_feedthru_ndr, R74): PrimeTime cannot fix their noise (dont_touch,
# reason V; r73 [M] 3-7 victims, all 343-389 um long).  r73 route [M]: act_o 1.18 m of 9.30 m routed wire; horizontal
# M3 / M5 / M7 use 3.79 m of 17.7 m of tracks (21 %), so even 3 tracks per act_o wire (+2.4 m worst case) fits.
set P(FEEDTHRU_NDR) 2
# act_o load = the next column's act pin = this block's own act[b] net, per bit (io_budget.tcl; flow/icc2 qb_io_load)
set P(IO_LOAD)      {qb5_act_o_caps qb5_act_o_load}
# act[b] input transition = own act_o[b] transition, per bit and scenario (io_budget.tcl; flow/icc2 qb_io_load, R71)
set P(IO_TRAN)      {qb5_act_tran qb5_act_tran_apply qb5_act_tran_diff}
# act_o -min = -(early I/O latency + fastest clock -> Q), after every compute_clock_latency (io_budget.tcl, R78)
set P(IO_MIN)       {qb5_act_o_lat_icc2 qb5_act_o_min_icc2}
# logged: init's external delay of one port per budget class; qb_io_lat's clock network delays of act[0] -> act_o[0]
set P(IO_SAMPLE)    {act[0] cd[0] pf[0] act_o[0] f_y[0]}
set P(IO_PAIR)      {act[0] act_o[0]}
# abstract abutment gate (flow/icc2/abstract.tcl): every act[b] on the west edge faces act_o[b] on the east edge
set P(ABUT_PAIR)    {act act_o}
# strip: die 390 x 3110 um, core 380 x 3100 um (5-um margin; {left bottom right top}), no macros.  The rows stay at
# x = 5.0 + 0.2 k: the block pins of M2 / M4 / M6 are at x = 0.1 + 0.2 k (R92 [M], 3138 of 3138), the kit LEF phase
# against these rows, so the tracks were moved onto pins and cell pins (flow/icc2/floorplan.tcl), not the rows
set P(DIE)          {{0 0} {390 3110}}
set P(CORE_OFFSET)  {5.0 5.0 5.0 5.0}
set P(PIN_DEF)      $::env(COL_PIN_DEF)
# PDN: M1 followpin rails + the chip PG grid (floorplan/pg_grid.tcl: M4 / M7 VSS / VDD straps, M7 = the VDD / VSS
# block pins across the die, VSS y 10.0 + 30k, VDD 25.0 + 30k; the top drops M8 straps on them)
set P(LAYERS)       {M2 M7}
# hold-cell reservation (R87, PI decision; flow/icc2 common.tcl qb_hold_reserve, place.tcl): soft keepout of one
# narrowest hold cell beside each cell driven by these ports whose fanout reaches a register within 2 levels (the direct
# port -> AO22 -> flop paths of qbc_pbank_w / qbc_pbank_f; r84 [M] 37 PT-unfixable hold endpoints pw / w_ld -> u_pbw)
set P(HOLD_RESERVE) {pw[*] pf[*] w_ld}
# input-port isolation (R88, PI decision; flow/icc2 common.tcl qb_isolate_ports, place.tcl): one buffer at the pin of every
# non-clock input but act (act -> act_o feedthrough, dont_touch, with its own budget: io_budget.tcl), so no internal net is
# driven by a port (r87 [M] PT-unfixable noise on the 1003 um port net s_rd[487])
set P(ISOLATE)      {cd[*] ctl[*] t2[*] pf[*] pw[*] s_rd[*] w_r[*] rst_n f_vld f_src f_sh p_ld w_vld w_sh w_ld}
# virtual metal fill (R96; flow/icc2 common.tcl qb_virtual_fill): P&R timing (place_opt .. route_opt, eco QoR) extracts
# with the kit deck's dummy metal emulated, as the fill-aware sign-off SPEF sees it (rgr [M]: 7 ICC2 vs 23 PT wcl setup
# violators at route without it)
set P(VIRTUAL_FILL) 1
# pre-route correlation (R98; flow/icc2 common.tcl qb_preroute): the rgr values (same kit, layers M2 - M7, virtual
# router and fill); the column's route_auto loss [M] -100 to -120 ps per path, so far absorbed only by its 140-150 ps
# of CTS-time slack.  place_opt / clock_opt only; route_opt, the ECO and sign-off are unchanged
set P(PREROUTE_CAP_SCALE)    1.2
set P(PREROUTE_SETUP_MARGIN) 0.040
