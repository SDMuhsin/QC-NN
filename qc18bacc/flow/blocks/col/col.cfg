# P&R config of the column hard block qb_col_blk (flow/tsmc65/pnr/run_pnr.sh design config; flow/README.md).
# Production recipe of r35_colb (results/r35.md, r5a.md, r5c.md, pnr_slice*.md):
#   floorplan  core 380 x 3100 um strip, 5-um margin; pins floorplan/col_pins.tcl (band pins, then every signal pin at
#              its position in the reference abstract QB35_COLPINS); PDN floorplan/pe_pdn.tcl
#   place      place/col_place.tcl: band seed, the 16 PE rows tiled from their standalone placements (QB_TILE_DIR) and
#              fixed during timing-driven gpl, incremental re-spread before the first legalisation
#   cts        flow CTS (balance levels, CKBD4 cluster buffers); post-CTS repair repair/post_cts.tcl with the per-class
#              IO budget (blocks/col/io_budget.tcl) shifted by QB_IO_LAT, GRT layer adjustment QB15_GADJ_L
#   route      GRT 0.15 (+ M2-M3 0.6), GRT estimates route/col_post_grt.tcl, antenna repair 3 iterations, DR 64 iterations
# Environment (set by blocks/col/run.sh): QB_SYN (netlist tag), QB_PNR_PERIOD (P&R period), QB35_COLPINS, QB_TILE_DIR,
# QB_IO_LAT, QB15_GADJ_L.
source [file normalize $::env(QC_FLOW)/../../qc18bacc/flow/common/qb.tcl]
set ::env(QB_TOP) [expr {[info exists ::env(QB_TOP)] ? $::env(QB_TOP) : "qb_col_blk"}]
set ::env(QB_SYN) [expr {[info exists ::env(QB_SYN)] ? $::env(QB_SYN) : "qb_col_blk_tt_p1.65_topo"}]
set ::QC_CORNERS tt
set P(TOP) $::env(QB_TOP)
set P(SYN) $::env(QB_SYN)
source $::QBF/common/block_sdc.tcl
# strip geometry: core 380 x 3100 um, 5-um margin
set P(DIE_AREA)  {0 0 390.0 3110.0}
set P(CORE_AREA) {5.0 5.0 385.0 3105.0}
set P(PLACE_DENSITY) 0.75
set P(TIMING_DRIVEN) 1
set P(ROUTABILITY_DRIVEN) 0
set P(GPL_ARGS)      {-skip_initial_place}
set P(PLACE_PAD)     0
set P(DPL_ARGS)      {}
set P(MAX_UTIL)      90
set P(PIN_TCL)       $::QBF/floorplan/col_pins.tcl
set P(PDN_TCL)       $::QBF/floorplan/pe_pdn.tcl
set P(PRE_PLACE_TCL) $::QBF/place/col_place.tcl
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
set P(PRE_CTS_TCL)   ""
set P(PRE_ROUTE_TCL) $::QBF/blocks/col/route_pre.tcl
set P(POST_GRT_TCL)  $::QBF/route/col_post_grt.tcl
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     0.15
set P(ANTENNA_ITER)  3
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   64
set P(DR_ARGS)       {}
set P(GDS)           0
# per-class IO budget (blocks/col/io_budget.tcl) in the P&R SDC; after CTS repair/post_cts.tcl applies it shifted by QB_IO_LAT
set ::env(QB_IO_BUDGET) $::QBF/blocks/col/io_budget.tcl
if {[info exists P(SDC)] && [file exists $P(SDC)]} {
    source $::QBF/blocks/col/io_budget.tcl
    set _f [open $P(SDC)]; set _t [read $_f]; close $_f
    regexp -line {^create_clock .*-period ([0-9.]+)} $_t -> _per
    # (the marker text is kept from the original r5a recipe so the generated SDC is byte-identical)
    if {[string first "# r5a IO budget" $_t] < 0} {
        set _f [open $P(SDC) a]; puts $_f "\n# r5a IO budget (impl/r5a/budget.tcl), period $_per\n[qb5_io_lines $_per]"; close $_f
    }
}
