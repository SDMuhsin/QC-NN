# P&R config of the south hub hard block qb_hub (flow/tsmc65/pnr/run_pnr.sh design config; flow/README.md).
# One flat file for what blocks/hub/hub.cfg + the QC_PNR_SET hook pairs of impl/r22/run.sh and impl/r34/preset.env made
# (results/r9b.md .. r34.md).  Re-sourced through <run>/config.tcl by every standalone OpenROAD step (dr, diodes, antenna,
# hold ECO, re-route, abstract).
#   netlist    $QB9_W/qb_hub_c.v (RTL QB_TOP_PTR 1 partition r26_ptr); SDC + IO budget $QB9_W/cfg_<tag>/ (blocks/hub/sdc.py,
#              written by run.sh gate: the run dir is wiped by the init step)
#   floorplan  <run>/mplace.tcl (floorplan/hub_mplace.py: die, core, macros), pins floorplan/hub_pins.tcl, PDN as the chip
#              (floorplan/pdn_chip.tcl, pdn_macro.tcl, no column-block grid)
#   place      place/hub_place_pre.tcl (port buffers, max fanout 32, max transition 0.4, remove_buffers, incremental gpl
#              0.65 + DRV repair twice, channel blockages), gpl density 0.62 timing driven
#   cts        cts/hub_cts_pre.tcl (repeater-pair collapse, CK-only clock-net repair, ICG sizing), flow CTS
#   route      route/hub_route_pre.tcl (IO latency L measured, post-CTS repair repair/post_cts.tcl + repair/hub_post_cts.tcl,
#              per-layer GRT adjustment), GRT 0.25 / 10 iterations, route/hub_post_grt.tcl (setup + hold repair at GRT
#              parasitics, antenna repair, db/grt.odb, exit); DR 64 iterations in its own process (route/dr.sh)
# Environment: QB9_W [$QC_BUILD/r26_w]; QB_DPL_ARGS (detailed_placement args; run.sh sets "-max_displacement 500" for the
# P&R steps, the hold ECOs run without it); QB_IO_LAT (prod: fallback L).
source [file normalize $::env(QC_FLOW)/../../qc18bacc/flow/common/qb.tcl]
set ::QC_CORNERS tt
set ::QC_PNR_MAX_LAYER M9
set _w [qb_env QB9_W $::QC_BUILD/r26_w]
set P(TOP) qb_hub
set P(NETLIST) $_w/qb_hub_c.v
# per-run SDC / IO budget: $QB9_W/cfg_<tag>/
set _sd $_w/cfg_[expr {[info exists ::env(QC_PNR_OUT)] ? [file tail $::env(QC_PNR_OUT)] : "none"}]
set P(SDC) $_sd/qb_hub.sdc
set _mdir /tmp/$::env(USER)/qcnn/macros
array set _mc {ss ss_0p9v_125c tt tt_1p0v_25c ff ff_1p1v_m40c}
set P(MACRO_LEFS) {}
foreach m {qb_s_256x128m1 qb_b_128x128m1 qb_i_128x128m1 qb_p_240x144m2 qb_f_3232x128m8} {
    lappend P(MACRO_LEFS) $_mdir/$m/$m.lef
    foreach c {ss tt ff} { lappend P(MACRO_LIBS_$c) $_mdir/$m/${m}_$_mc($c)_syn.lib }
}
set P(MACRO_AUTO) 0
set P(MACRO_HALO) {7.0 7.0}
if {[info exists ::env(QC_PNR_OUT)] && [file exists $::env(QC_PNR_OUT)/mplace.tcl]} { source $::env(QC_PNR_OUT)/mplace.tcl }
set ::env(QB_PDN_BLK) 0
set P(PDN_TCL)       $::QBF/floorplan/pdn_chip.tcl
set P(MACRO_PDN_TCL) $::QBF/floorplan/pdn_macro.tcl
set P(PIN_TCL)       $::QBF/floorplan/hub_pins.tcl
set P(PLACE_DENSITY) 0.62
set P(TIMING_DRIVEN) 1
set P(ROUTABILITY_DRIVEN) 0
set P(GPL_ARGS)      {}
set P(PRE_PLACE_TCL) $::QBF/place/hub_place_pre.tcl
set P(QB_GPL_INCR_DENS) 0.65
set P(PLACE_PAD)     0
set P(DPL_ARGS)      [qb_env QB_DPL_ARGS {}]
set P(MAX_UTIL)      90
set P(PRE_CTS_TCL)   $::QBF/cts/hub_cts_pre.tcl
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
set ::env(QB_IO_BUDGET) $_sd/hub_io.tcl
set P(PRE_ROUTE_TCL) $::QBF/route/hub_route_pre.tcl
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     0.25
set P(GR_ITER)       10
set P(POST_GRT_TCL)  $::QBF/route/hub_post_grt.tcl
set P(ANTENNA_ITER)  0
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   64
set P(DR_ARGS)       {}
set P(DCAP)          0
set P(GDS)           0
