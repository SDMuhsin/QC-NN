# P&R config of the act-supply hard block qb_act2_blk (flow/tsmc65/pnr/run_pnr.sh design config; flow/README.md).
# Production recipe of r35_act -> r38_act_rr2 (results/r7c.md, r9a.md, r13.md, r16.md, r19.md, r20.md, r35.md):
#   floorplan  die 900 x 1970 um, core 5-um margin; pins floorplan/act_pins.tcl (act east at column 0's act pins
#              QB7_COLPINS, s_q fixed on M6 in the hub's order, the rest south); PDN floorplan/pe_pdn.tcl
#   place      place/act_place.tcl: S1 padding, act output chains placed at their pins, act-row band seed, TD gpl at
#              density 0.55, DRV repair + incremental re-spread + second DRV repair
#   cts        ICG split + sizing (cts/icg_pre.tcl), flow CTS (balance levels, CKBD4 cluster buffers); run stops after CTS
#   postcts    repair/act_post_cts.tcl (PRE_ROUTE_TCL, run from db/cts.odb): re-spread of the CTS checkpoint, post-CTS DRV /
#              timing repair repair/post_cts.tcl with the IO budget (blocks/act/io_budget.tcl) shifted by the measured
#              insertion delay, db/cts_rt.odb, stop
#   route      route/act_route.tcl from db/cts_rt.odb (GRT 0.25 + QB15_GADJ_L, DRV repair, antenna repair 3 iterations, DR 64
#              with the kit min-step / EOL rules)
# Environment (set by blocks/act/run.sh): QB_SYN (netlist tag; common/or.sh scripts see its default r26_ptr: no SDC is
# then written), QB_PNR_PERIOD (P&R period, SDC rescale), QB7_MAXTRAN / QB7_MAXFO (P&R DRV limits appended to the SDC),
# QB7_DPL_ARGS (detailed_placement options of the P&R steps; {} in the hold step), QB7_COLPINS, QB7_YOFF, QB_RT_LOOPS, QB_DRV_SLEW.
source [file normalize $::env(QC_FLOW)/../../qc18bacc/flow/common/qb.tcl]
set ::env(QB_TOP) [expr {[info exists ::env(QB_TOP)] ? $::env(QB_TOP) : "qb_act2_blk"}]
set ::env(QB_SYN) [expr {[info exists ::env(QB_SYN)] ? $::env(QB_SYN) : "r7c_act_tt_p1.65_topo"}]
set ::QC_CORNERS tt
set P(TOP) $::env(QB_TOP)
set P(SYN) $::env(QB_SYN)
source $::QBF/common/block_sdc.tcl
# die 900 x 1970 um, core 890 x 1960 um (5-um margin)
set P(DIE_AREA)  {0 0 900.0 1970.0}
set P(CORE_AREA) {5.0 5.0 895.0 1965.0}
set P(PLACE_DENSITY) 0.55
set P(TIMING_DRIVEN) 1
set P(ROUTABILITY_DRIVEN) 0
set P(GPL_ARGS)      {}
set P(PLACE_PAD)     0
# QB7_DPL_ARGS: detailed_placement options (r7c_A4 / B4: DPL-0036 on the act-edge / S1 / S2 clumps with the default window)
set P(DPL_ARGS)      [qb_env QB7_DPL_ARGS {}]
set P(MAX_UTIL)      90
set P(PIN_TCL)       $::QBF/floorplan/act_pins.tcl
set P(PDN_TCL)       $::QBF/floorplan/pe_pdn.tcl
set P(PRE_PLACE_TCL) $::QBF/place/act_place.tcl
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
set P(PRE_CTS_TCL)   $::QBF/cts/icg_pre.tcl
set P(PRE_ROUTE_TCL) $::QBF/repair/act_post_cts.tcl
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     0.25
set P(ANTENNA_ITER)  3
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   64
set P(DR_ARGS)       {}
set P(GDS)           0
# IO budget (blocks/act/io_budget.tcl) appended to the P&R SDC; after CTS repair/post_cts.tcl applies it shifted by the measured L
set ::env(QB_IO_BUDGET) $::QBF/blocks/act/io_budget.tcl
if {[info exists P(SDC)] && [file exists $P(SDC)]} {
    source $::QBF/blocks/act/io_budget.tcl
    set _f [open $P(SDC)]; set _t [read $_f]; close $_f
    regexp -line {^create_clock .*-period ([0-9.]+)} $_t -> _per
    # (the marker text is kept from the original r7c recipe so the generated SDC is byte-identical)
    if {[string first "# r7c IO budget" $_t] < 0} {
        set _f [open $P(SDC) a]; puts $_f "\n# r7c IO budget (impl/r7c/budget.tcl), period $_per\n[qb7_io_lines $_per]"; close $_f
        # QB7_MAXTRAN / QB7_MAXFO: P&R max transition (ns) / max fanout instead of the DC SDC's (set in the P&R steps only)
        if {[qb_env QB7_MAXTRAN ""] ne ""} { set _f [open $P(SDC) a]; puts $_f "set_max_transition [qb_env QB7_MAXTRAN 0.2] \[current_design\]"; close $_f }
        if {[qb_env QB7_MAXFO ""] ne ""} { set _f [open $P(SDC) a]; puts $_f "set_max_fanout [qb_env QB7_MAXFO 16] \[current_design\]"; close $_f }
    }
}
