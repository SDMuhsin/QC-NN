# ICC2 config of the regression block qb_lane_n (flow/icc2/*.tcl; blocks/rgr/run.sh pnr): the column's design facts
# (blocks/col/icc2.cfg) on a small macro-free design.  Netlist + SDC: DC run QB_SYN at QB_PNR_PERIOD (common/block_sdc.tcl)
# + the IO budget blocks/rgr/io_budget.tcl (the column's budget procs with this block's port classes).  Environment from
# blocks/rgr/rgr.env via run.sh.  No feedthrough (P(FEEDTHRU*), P(IO_MIN): none); P(IO_LOAD / IO_TRAN): below.
set P(TOP)          $::env(RGR_TOP)
set P(SYN)          $::env(QB_SYN)
set P(IO_BUDGET)    $::QBF/blocks/rgr/io_budget.tcl
# init: external delay of one port per budget class, logged (flow/icc2/init.tcl)
set P(IO_SAMPLE)    {x[0] y_o[0]}
# die from rgr.env, 5-um core margin {left bottom right top}, pins of the run's floorplan DEF QB_PIN_DEF (run.sh
# blk_pre_pnr, common/block.sh blk_pins); PDN = the chip PG grid (floorplan/pg_grid.tcl), routing M2 - M7 as the column
set P(DIE)          [list {0 0} $::env(RGR_DIE)]
set P(CORE_OFFSET)  {5.0 5.0 5.0 5.0}
set P(PIN_DEF)      $::env(QB_PIN_DEF)
set P(LAYERS)       {M2 M7}
# the column's opt-ins, so the regression runs their code: hold-cell reservation (R87) on two operand buses, input-port
# isolation (R88) on every non-clock input (flow/icc2 common.tcl qb_hold_reserve / qb_isolate_ports)
set P(HOLD_RESERVE) {h[*] r[*]}
set P(ISOLATE)      {x[*] m[*] sh[*] h[*] r[*] t[*] rst_n vld mode}
# virtual metal fill in P&R extraction (R96, the column's opt-in; flow/icc2 common.tcl qb_virtual_fill)
set P(VIRTUAL_FILL) 1
# pre-route correlation (R98; flow/icc2 common.tcl qb_preroute): virtual-route cap scale 1.2, late = early (calibrated on vf2b:
# cts estimate vs route_auto without SI, 40 worst wcl endpoints, mean +5.7 / median -5.6 ps) and 0.040 ns extra setup
# uncertainty for the SI delta routing adds ([M] -41 to -49 ps on the worst paths), place_opt / clock_opt only
set P(PREROUTE_CAP_SCALE)    1.2
set P(PREROUTE_SETUP_MARGIN) 0.040
# the column's per-bit chain IO (R109; flow/icc2 common.tcl qb_io_load from CTS on, blocks/col/io_budget.tcl qb5_io_*), so
# the regression runs that code: lanes abut like the columns, y_o[b] -> the next lane's x[b] (both 16 bits), so y_o[b]
# load = own x[b] net capacitance (a few fF: the port stub to its isolation buffer) and x[b] input transition = own y_o[b]
# transition.  ICC2 only: PrimeTime keeps the SDC's output load / input driving cells (signoff/pt/rgr_blk.tcl)
set P(IO_LOAD)      {{qb5_io_caps x} {qb5_io_load y_o}}
set P(IO_TRAN)      {{qb5_io_tran y_o} {qb5_io_tran_apply x} qb5_io_tran_diff}
