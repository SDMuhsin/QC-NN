# P&R config of the R13 qb_act2_blk (results/r13.md): impl/r9a/act.cfg + S1 cell padding (pad.tcl) in placement and in
# the post-CTS repair.  Density: QB_DENS (run.sh default 0.55 here, R9a 0.65), see r13.md (post-gpl inflation).
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r9a/act.cfg]
set ::QB13_DIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r13]
set P(PRE_PLACE_TCL) $::QB13_DIR/place.tcl
set P(PRE_ROUTE_TCL) $::QB13_DIR/post_cts.tcl
# QB13_PINS 1: chip floorplan pins of R11 (impl/r13/pins.tcl: all non-act pins south, s_q in the hub's order through T)
if {[qb_env QB13_PINS 0]} { set P(PIN_TCL) $::QB13_DIR/pins.tcl }
