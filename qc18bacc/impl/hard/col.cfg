# P&R config of the column with 16 hardened PEs (results/pnr_pe.md), for flow/tsmc65/pnr/run_pnr.sh.
# Netlist: DC topographical qb_col_cwfp with the PEs linked to the routed block qb_pe_hb (impl/hard/col_hb.tcl), block
# modules stripped (strip_blocks.py -> <run>/qb_col_cwfp_hb.v); block views QB_HB_LEF (write_abstract_lef) and
# QB_HB_LIB (PrimeTime extract_model ETM, tt).
# Floorplan (col_fp.tcl), bottom-up: lane band (fused + wide lanes, parameter banks, PPU controls; height QB_HL from
# the cell area at QB_LANE_UTIL), then 8 levels of 2 PEs, level L = rows 2L (west, R0) and 2L + 1 (east, MY: block
# pins mirrored, so act faces the die edge and the BR pins face the spine); a QB_SPINE-um spine between the two PE
# stacks holds the CREG port registers, decoders and both broadcast registers; QB_HALO um keep-out around each block.
# Pins: act / b2 of row r on the west (even r) or east (odd r) die edge at PE r's level; codes / ctl / t2 / clk on
# top over the spine; lane stream / banks / PPU controls at the bottom.  Signal routing M2-M9 (M8 / M9 over the
# blocks), PDN col_pdn.tcl.  Timing-driven placement -> CTS -> one setup + one hold repair, each legalised
# (slice_post_cts.tcl, QB_RT_LOOPS 0) -> global + detailed route.
set ::QC_CORNERS [expr {[info exists ::env(QB_CORNERS)] ? $::env(QB_CORNERS) : "tt"}]
proc qb_env {n d} { return [expr {[info exists ::env($n)] ? $::env($n) : $d}] }
set ::QB_DIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr]
set ::QB_HDIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/hard]
set ::QC_PNR_MAX_LAYER [qb_env QB_COL_MAXL M9]
set P(TOP) qb_col_cwfp
set P(SYN) [qb_env QB_SYN qb_col_cwfp_hb_tt_p1.65_topo]
set _s [expr {[file isdirectory $P(SYN)] ? $P(SYN) : "$::QC_BUILD/syn/$P(SYN)"}]
if {[info exists ::env(QC_PNR_OUT)]} {
    set P(NETLIST) $::env(QC_PNR_OUT)/qb_col_cwfp_hb.v
    if {![file exists $P(NETLIST)]} {
        puts [exec $::env(QC_PY) -I $::QB_HDIR/strip_blocks.py $_s/$P(TOP).v $P(NETLIST) qb_pe_hb]
    }
}
source $::QB_HDIR/sdc_pnr.tcl
qb_sdc_pnr $_s $P(TOP)
set P(MACRO_LEFS)    [qb_env QB_HB_LEF {}]
set P(MACRO_LIBS_tt) [qb_env QB_HB_LIB {}]
set P(MACRO_AUTO)    0
set ::QB_HALO        [qb_env QB_HALO 4.0]
set P(MACRO_HALO)    [list $::QB_HALO $::QB_HALO]
source $::QB_HDIR/col_geom.tcl
set P(DIE_AREA)      $::QB_DIE
set P(CORE_AREA)     $::QB_CORE
set P(MACRO_PLACE)   $::QB_MPLACE
set P(PLACE_DENSITY) [qb_env QB_DENS 0.75]
set P(TIMING_DRIVEN) 1
set P(ROUTABILITY_DRIVEN) [qb_env QB_RD 0]
set P(PLACE_PAD)     0
set P(DPL_ARGS)      [qb_env QB_DPL_ARGS {-max_displacement {400 400}}]
set P(MAX_UTIL)      90
set P(PIN_TCL)       $::QB_HDIR/col_pins.tcl
set P(PRE_PLACE_TCL) [expr {[qb_env QB_PREMOVE 1] ? "$::QB_HDIR/col_place.tcl" : ""}]
set P(PDN_TCL)       $::QB_HDIR/col_pdn.tcl
set P(MACRO_PDN_TCL) $::QB_HDIR/col_pdn_macro.tcl
set P(CTS_ARGS)      [qb_env QB_CTS_ARGS {-balance_levels -sink_clustering_buffer CKBD4}]
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
set ::env(QB_RT_LOOPS) [qb_env QB_RT_LOOPS 0]
set P(PRE_ROUTE_TCL) $::QB_DIR/slice_post_cts.tcl
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     [qb_env QB_GR_ADJ 0.25]
set P(ANTENNA_ITER)  0
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   [qb_env QB_DR_ITER 20]
set P(DR_ARGS)       [qb_env QB_DR_ARGS {}]
set P(DCAP)          0
set P(GDS)           0
