# P&R config of the hardened PE block qb_pe_hb (results/pnr_pe.md), for flow/tsmc65/pnr/run_pnr.sh.
# Netlist QB_SYN (default qb_pe_hb_tt_p1.65_topo: DC topographical, tt, 1.65 ns, hook impl/hard/topo_pe.tcl).
#   * square block: core QB_HB_W x QB_HB_W um (default from the DC area / QB_HB_UTIL 0.65), 2-um margin
#   * pins on the edges the column floorplan (impl/hard/col.cfg) puts the neighbours at (pe_pins.tcl):
#     west a / b2, east c / nnw / ctl / t2 / fsh / wsh / clk / rst_n, north up / sh_in, south shd / sh_out
#   * signal routing M2-M7 (M8 / M9 left to the column above the block; M2-M5 failed GRT-0119 at the pin edges:
#     only M3 / M5 horizontal); PDN M1 rails + M4 straps + M7 straps,
#     the M7 straps are the block's VDD / VSS pins (pe_pdn.tcl)
#   * timing-driven placement, CTS, one setup + one hold repair each with legalisation (slice_post_cts.tcl,
#     QB_RT_LOOPS 0, IO latency shift 0), global + detailed route
set ::QC_CORNERS [expr {[info exists ::env(QB_CORNERS)] ? $::env(QB_CORNERS) : "tt"}]
proc qb_env {n d} { return [expr {[info exists ::env($n)] ? $::env($n) : $d}] }
set ::QB_DIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr]
set ::QB_HDIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/hard]
set ::QC_PNR_MAX_LAYER [qb_env QB_HB_MAXL M7]
set P(TOP) qb_pe_hb
set P(SYN) [qb_env QB_SYN qb_pe_hb_tt_p1.65_topo]
set _s [expr {[file isdirectory $P(SYN)] ? $P(SYN) : "$::QC_BUILD/syn/$P(SYN)"}]
set P(NETLIST) $_s/$P(TOP).v
source $::QB_HDIR/sdc_pnr.tcl
qb_sdc_pnr $_s $P(TOP)
# block size from the DC cell area
set _a 25542.0
if {[file exists $_s/summary.txt]} { set _f [open $_s/summary.txt]; regexp {cell_area_um2 ([0-9.]+)} [read $_f] -> _a; close $_f }
set _w [qb_env QB_HB_W [expr {sqrt($_a / [qb_env QB_HB_UTIL 0.65])}]]
set _w [expr {ceil($_w / 1.8) * 1.8}]
set m 2.0
set P(DIE_AREA)  [list 0 0 [expr {$_w + 2 * $m}] [expr {$_w + 2 * $m}]]
set P(CORE_AREA) [list $m $m [expr {$_w + $m}] [expr {$_w + $m}]]
set P(PLACE_DENSITY) [qb_env QB_DENS 0.75]
set P(TIMING_DRIVEN) 1
set P(ROUTABILITY_DRIVEN) [qb_env QB_RD 0]
set P(PLACE_PAD)     0
set P(DPL_ARGS)      {}
set P(MAX_UTIL)      90
set P(PIN_TCL)       $::QB_HDIR/pe_pins.tcl
set P(PDN_TCL)       $::QB_HDIR/pe_pdn.tcl
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
set ::env(QB_IO_LAT)    [qb_env QB_IO_LAT 0.0]
set ::env(QB_RT_LOOPS)  [qb_env QB_RT_LOOPS 0]
set P(PRE_ROUTE_TCL) $::QB_DIR/slice_post_cts.tcl
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     [qb_env QB_GR_ADJ 0.25]
set P(ANTENNA_ITER)  0
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   [qb_env QB_DR_ITER 30]
set P(DR_ARGS)       [qb_env QB_DR_ARGS {}]
set P(DCAP)          0
set P(GDS)           0
