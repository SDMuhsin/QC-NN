# P&R config of the full chip qb_chip (results/r5b.md), for flow/tsmc65/pnr/run_pnr.sh.
# Netlist: DC topographical qb_chip with the core = 8 x qb_col_blk black boxes (impl/r5b/gen.sh + impl/r4/run.sh syn,
# tag QB_SYN, default r5b_top).  Block views (QB_BLK dir): abstract LEF of the routed R5d run B column reduced to an
# edge ring of exact shapes (lef_ring.py), ETM tt (PrimeTime extract_model; P&R copy with the clock-tree insertion
# arcs of etm_ins.py for CTS -insertion_delay).  ARM macros: impl/r4/macros.txt + impl/r5e/macros.txt views.
# Floorplan (mplace.py -> <run>/mplace.tcl, generated from db/init.odb by run.sh): 8 abutted columns, weight rf_sp
# rows north, S rf_2p / B maps / params rows south, act supply strip west (FC, descriptors, image, 9th params).
# Recipe (defaults = run v): remove_buffers + gpl (density 0.62, not routability / timing driven), DRV repair at max
# transition 0.4 ns + incremental gpl + DRV repair (pre_place.tcl), detailed placement (1 000 um), CTS, one setup + one
# hold repair each legalised (impl/pnr/slice_post_cts.tcl, QB_RT_LOOPS 0; QB_POSTCTS 0 skips), GRT, DR (QB_DR_ITER).  Signal routing M2-M9 (M8 / M9
# only over the blocks), PDN impl/r5b/pdn.tcl.
proc qb_env {n d} { return [expr {[info exists ::env($n)] ? $::env($n) : $d}] }
set ::QC_CORNERS [qb_env QB_CORNERS tt]
set ::QB_R5B [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r5b]
set ::QB_DIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr]
set ::QC_PNR_MAX_LAYER M9
set P(TOP) qb_chip
set P(SYN) [qb_env QB_SYN r5b_top]
set _s [expr {[file isdirectory $P(SYN)] ? $P(SYN) : "$::QC_BUILD/syn/$P(SYN)"}]
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/hard/sdc_pnr.tcl]
qb_sdc_pnr $_s $P(TOP)
# block + ARM macro views
set _blk [qb_env QB_BLK $::QC_BUILD/r5b_blk]
set _mdir [qb_env QB_MDIR /tmp/$::env(USER)/qcnn/macros]
array set _mc {ss ss_0p9v_125c tt tt_1p0v_25c ff ff_1p1v_m40c}
set P(MACRO_LEFS) [list $_blk/qb_col_blk_ring.lef]
foreach c {ss tt ff} { set P(MACRO_LIBS_$c) [list $_blk/qb_col_blk_${c}_ins.lib] }
foreach m {qb_w_204x144m2 qb_s_256x128m1 qb_b_128x128m1 qb_i_128x128m1 qb_p_240x144m2 qb_d_624x80m8 qb_f_3232x128m8} {
    lappend P(MACRO_LEFS) $_mdir/$m/$m.lef
    foreach c {ss tt ff} { lappend P(MACRO_LIBS_$c) $_mdir/$m/${m}_$_mc($c)_syn.lib }
}
# floorplan: die / core / macro placement from <run>/mplace.tcl (written by run.sh after the init step)
set P(MACRO_AUTO) 0
set P(MACRO_HALO) [list [qb_env QB_HALO 7.0] [qb_env QB_HALO 7.0]]
if {[info exists ::env(QC_PNR_OUT)] && [file exists $::env(QC_PNR_OUT)/mplace.tcl]} { source $::env(QC_PNR_OUT)/mplace.tcl }
set P(PDN_TCL)       $::QB_R5B/pdn.tcl
set P(MACRO_PDN_TCL) $::QB_R5B/pdn_macro.tcl
set P(PLACE_DENSITY) [qb_env QB_DENS 0.62]
set P(TIMING_DRIVEN) [qb_env QB_TD 0]
set P(ROUTABILITY_DRIVEN) [qb_env QB_RD 0]
set P(GPL_ARGS)      [qb_env QB_GPL_ARGS {}]
set P(PRE_PLACE_TCL) $::QB_R5B/pre_place.tcl
set P(PLACE_PAD)     0
set P(DPL_ARGS)      [qb_env QB_DPL_ARGS {-max_displacement {1000 1000}}]
set P(MAX_UTIL)      90
# CTS: -insertion_delay (with the ETM clock-tree-path arcs) left OpenROAD STA without any clocked path (results/r5b.md 4)
set P(CTS_ARGS)      [qb_env QB_CTS_ARGS {-balance_levels -sink_clustering_buffer CKBD4}]
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
set ::env(QB_RT_LOOPS) [qb_env QB_RT_LOOPS 0]
set P(PRE_ROUTE_TCL) [expr {[qb_env QB_POSTCTS 1] ? "$::QB_DIR/slice_post_cts.tcl" : ""}]
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     [qb_env QB_GR_ADJ 0.25]
set P(ANTENNA_ITER)  0
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   [qb_env QB_DR_ITER 6]
set P(DR_ARGS)       [qb_env QB_DR_ARGS {}]
set P(DCAP)          0
set P(GDS)           0
