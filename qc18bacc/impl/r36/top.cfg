# R36 top config (results/r36.md) = impl/r35/top.cfg with opt-in fixes of the R35a pre-mortem (top-level items):
#   views  QB11_ABS dir (impl/r36/run36.sh abs): if it holds qb_col_blk.lef, that replaces the r5b_blk column ring LEF
#          (bug 3: top built on stale block layouts); hub / act LEFs from the same dir as before (bug 2: act PG pins)
#   PDN    QB36_PGPINS [1]: impl/r36/pdn36.tcl (chip PG pins on M9 -> check_power_grid has sources; bug 2)
#   SDC    impl/r36/top_sdc.tcl: chip IO delays shifted by QB35_TOPL as in PT (bug 8)
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r35/top.cfg]
set ::QB_R36 [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r36]
set _a $::env(QB11_ABS)
if {[file exists $_a/qb_col_blk.lef]} {
    set P(MACRO_LEFS) [lmap l $P(MACRO_LEFS) { expr {[string match *r5b_blk/qb_col_blk_ring.lef $l] ? "$_a/qb_col_blk.lef" : $l} }]
}
if {[qb_env QB36_PGPINS 1]} { set P(PDN_TCL) $::QB_R36/pdn36.tcl }
set P(SDC) $::QB_R36/top_sdc.tcl
