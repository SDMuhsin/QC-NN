# P&R config of one column slice of the qc18bacc compute core (hw/rtl/qb_col.sv = qb_core #(16, 1): 16 PEs, 36
# decoders, 2 broadcast registers, 32 fused + 4 wide lanes, 8 + 8 parameter records), results/pnr_slice.md.
# For flow/tsmc65/pnr/run_pnr.sh; netlist QB_SYN (default qb_col_tt_p2.0_topo: DC topographical, tt, 2.0 ns).
# Differences to core.cfg (results/pnr_core.md, 8 x 2 proxy on a square die):
#   * floorplan: a tall strip W x H (QB_W core width um, QB_H core height um; default 330 x 3100 = utilisation 0.68 of
#     the topographical DC area), pins on the abutment edges (slice_pins.tcl): act / b2 left at their PE row band,
#     cd / ctl / t2 / clk top, lane stream + parameter banks + PPU controls bottom (where the S macros / parameter
#     store sit below the core's lane band)
#   * placement: per-PE-row bands and a lane band at the bottom as a placement seed (slice_place.tcl; gpl ignores region fences in this build),
#     timing-driven global placement (QB_TD 1), DRV repair of violating nets only (REPAIR_DESIGN auto), optional lane
#     compaction QB_COMPACT 1 | 2 (negative result, results/pnr_slice.md)
#   * CTS, then repair_timing -setup and -hold at tt (slice_post_cts.tcl before global route, from db/cts.odb), route
set ::QC_CORNERS [expr {[info exists ::env(QB_CORNERS)] ? $::env(QB_CORNERS) : "tt"}]
proc qb_env {n d} { return [expr {[info exists ::env($n)] ? $::env($n) : $d}] }
set d [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr]
set ::QB_DIR $d
set P(TOP) [qb_env QB_TOP qb_col]
set P(SYN) [qb_env QB_SYN qb_col_tt_p2.0_topo]
# DC SDC without the -min (ff / lt) operating condition (OpenROAD here loads the tt liberty only, STA-0115 otherwise)
# and without the net set_load / set_resistance annotations of a topographical run
set _s [expr {[file isdirectory $P(SYN)] ? $P(SYN) : "$::QC_BUILD/syn/$P(SYN)"}]
set P(NETLIST) $_s/$P(TOP).v
if {[info exists ::env(QC_PNR_OUT)] && [file exists $_s/$P(TOP).sdc]} {
    set _f [open $_s/$P(TOP).sdc]; set _t [read $_f]; close $_f
    regsub -all {\\\n\s*-min \S+ -min_library \S+} $_t {} _t
    # DC topographical writes its estimated per-net load / resistance (1.2 M lines): drop them, P&R has real RC
    regsub -all -line {^set_(load|resistance) .*\[get_nets .*$} $_t {} _t
    # QB_PNR_PERIOD (results/pnr_slice2.md): DC synthesised with a setup margin (shorter period); P&R re-times the
    # netlist at this period: clock period, IO delays (QC_IO_PCT 20 % of it) and max transition (min(0.5, 0.1 P))
    if {[info exists ::env(QB_PNR_PERIOD)]} {
        set _p $::env(QB_PNR_PERIOD)
        regexp -line {^create_clock .*-period ([0-9.]+)} $_t -> _p0
        regsub -all -line {(^create_clock .*-period )[0-9.]+(\s+-waveform )\{[^\}]*\}} $_t \
            "\\1$_p\\2{0 [expr {0.5 * $_p}]}" _t
        regsub -all -line {(^set_(input|output)_delay -clock qb_clk\s+)[0-9.]+} $_t "\\1[expr {0.2 * $_p}]" _t
        regsub -all -line {(^set_max_transition )[0-9.]+} $_t "\\1[expr {min(0.5, 0.1 * $_p)}]" _t
        puts "QB_PNR_PERIOD: DC period $_p0 -> $_p ns (IO delay, max transition rescaled)"
    }
    set _f [open $::env(QC_PNR_OUT)/$P(TOP)_pnr.sdc w]; puts -nonewline $_f $_t; close $_f
    set P(SDC) $::env(QC_PNR_OUT)/$P(TOP)_pnr.sdc
}
# strip geometry: core W x H um (QB_W, QB_H), 5-um margin
set ::QB_W [qb_env QB_W 330.0]
set ::QB_H [qb_env QB_H 3100.0]
set m 5.0
set P(DIE_AREA)  [list 0 0 [expr {$::QB_W + 2 * $m}] [expr {$::QB_H + 2 * $m}]]
set P(CORE_AREA) [list $m $m [expr {$::QB_W + $m}] [expr {$::QB_H + $m}]]
set P(PLACE_DENSITY) [qb_env QB_DENS 0.75]
set P(TIMING_DRIVEN) [qb_env QB_TD 1]
set P(ROUTABILITY_DRIVEN) [qb_env QB_RD 0]
set P(GPL_ARGS)      [qb_env QB_GPL_ARGS {-skip_initial_place}]
set P(PLACE_PAD)     0
set P(DPL_ARGS)      {}
set P(MAX_UTIL)      90
set P(PIN_TCL)       $d/slice_pins.tcl
set P(PRE_PLACE_TCL) $d/slice_place.tcl
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
# QB_REPIN 1 (results/pnr_slice2.md): after placement, the left-edge pins of PE row r (act, b2) move to where row r's
# cells were placed (slice_repin.tcl), before CTS
set P(PRE_CTS_TCL)   [expr {[qb_env QB_REPIN 0] ? "$d/slice_repin.tcl" : ""}]
set P(PRE_ROUTE_TCL) [expr {[qb_env QB_RT 1] ? "$d/slice_post_cts.tcl" : ""}]
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     [qb_env QB_GR_ADJ 0.25]
set P(ANTENNA_ITER)  0
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   [qb_env QB_DR_ITER 20]
set P(DR_ARGS)       [qb_env QB_DR_ARGS {}]
set P(GDS)           0
