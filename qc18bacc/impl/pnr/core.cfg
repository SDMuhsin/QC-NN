# P&R config of the qc18bacc compute core alone (results/pnr_core.md), for flow/tsmc65/pnr/run_pnr.sh.
# No macros.  Netlist: the R1 DC run (impl/run.sh all qb_core 2.0: tt compile 2.0 ns, WLM WireAreaLowkCon enclosed,
# 20 % IO delay), env QB_SYN (default qb_core_tt_p2.0) / QB_TOP (default qb_core; qb_core_s = 8 x 2 proxy).
# Recipe from qc18acc/results/pnr_v4.md, reduced to what applies without macros:
#   * gpl target density 0.70 at core utilisation 0.60 without cell padding (pad 1 + density 0.68: GPL-0302, the
#     padding of 1.37 M small cells; pad 1 + density 0.80: the DRV-repair buffers then pile up and detailed
#     placement with the v4 300-um window sat > 20 min in diamond search), default legalisation window; 512 x 512 bins (the automatic grid diverged on ~3 mm dies, GPL-0307), not timing / routability driven
#     (diverged / no gain on v2-v4; also run time on 1.37 M cells)
#   * flow default REPAIR_DESIGN auto (violating nets only; plain repair_design resizes every driver), followed by
#     an incremental global placement and a second DRV repair (gpl_incr.tcl, v4 mechanism 4)
#   * CTS -balance_levels (1 803 DC clock gates) -sink_clustering_buffer CKBD4 (v3: TritonCTS otherwise CKBD16)
#   * no antenna repair (segfaults in this build), no post-CTS / post-GRT timing repair (run time; DC sizing kept)
#   * IO pins: pins.tcl at the floorplan (ordered groups), replaced before placement by io_place.tcl (skip-IO gpl,
#     then side-constrained place_pins: array side left, b2 top, all lane-side buses right); pins.tcl sides were:
#     array side (act, cd, ctl, t2) left, b2 top, fused / wide parameter banks (pf, pw) bottom,
#     lane stream (s_rd, w_r in; f_y, f_b, w_y, w_b out, PPU controls) right
#   QC_PNR_TO=cts flow/tsmc65/pnr/run_pnr.sh qc18bacc/impl/pnr/core.cfg <tag>   (qc18bacc/impl/pnr/run.sh)
# Analysis corners of the P&R optimisation (DRV repair, CTS, estimates): tt only (env QB_CORNERS), as the DC run
# (tt compile, 2.0 ns).  With ss tt ff, the DRV repair fixes the 0.2-ns max transition (0.1 x the tt period) at ss,
# which DC never sized for: qbs +37 % cell area (28 k buffers, 37 k resized), utilisation 0.60 -> 0.825.
# Sign-off timing at tt and ss is PrimeTime with the routed SPEF (run.sh pt; ss SPEF via run.sh spef).
set ::QC_CORNERS [expr {[info exists ::env(QB_CORNERS)] ? $::env(QB_CORNERS) : "tt"}]
set d [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr]
set P(TOP) [expr {[info exists ::env(QB_TOP)] ? $::env(QB_TOP) : "qb_core"}]
set P(SYN) [expr {[info exists ::env(QB_SYN)] ? $::env(QB_SYN) : "$P(TOP)_tt_p2.0"}]
set P(CORE_UTIL)     [expr {[info exists ::env(QB_UTIL)] ? $::env(QB_UTIL) : 0.60}]
set P(ASPECT)        1.0
set P(CORE_MARGIN)   10.0
set P(PLACE_DENSITY) [expr {[info exists ::env(QB_DENS)] ? $::env(QB_DENS) : 0.70}]
set P(TIMING_DRIVEN) 0
set P(ROUTABILITY_DRIVEN) 0
set P(GPL_ARGS)      {-bin_grid_count 512}
set P(PLACE_PAD)     0
set P(DPL_ARGS)      {}
set P(MAX_UTIL)      90
set P(PIN_TCL)       $d/pins.tcl
set P(PRE_PLACE_TCL) $d/io_place.tcl
set P(CTS_ARGS)      {-balance_levels -sink_clustering_buffer CKBD4}
set P(REPAIR_TIMING) 0
set P(GR_ADJUST)     0.25
set P(ANTENNA_ITER)  0
set P(ANTENNA_CHECK) 0
set P(DR_END_ITER)   [expr {[info exists ::env(QB_DR_ITER)] ? $::env(QB_DR_ITER) : 24}]
set P(GDS)           0
