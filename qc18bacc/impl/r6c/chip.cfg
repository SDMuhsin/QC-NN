# P&R config of the R6c full chip (results/r6c.md): impl/r6b/chip.cfg (HPW144 netlist, R6b floorplan, group template
# placement) with
#   MAX_UTIL QB_MAX_UTIL (99): the resizer counts the 16.65 mm2 of blocks / macros (utilisation 0.897 at r6b_b CTS
#            = RSZ-0025) while the rows are only 72 % full (probe_rows.tcl)
#   place.tcl / cts_pre.tcl / route_pre.tcl: the R6b hooks + QB_SPREAD3 (spread3.tcl: nearest fine bin with room
#            instead of spread2's random point in a far super-bin) + QB_ICG (icg.tcl: ICG upsizing / move to the
#            gated-flop centroid before CTS); the spread procedures are also loaded for the post-CTS legalisations
#   ANTENNA_CHECK QB_ANT_CHECK (1), ANTENNA_ITER QB_ANT_ITER (0)
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r6b/chip.cfg]
set ::QB_R6C [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r6c]
set P(PRE_PLACE_TCL) $::QB_R6C/place.tcl
set P(PRE_CTS_TCL)   $::QB_R6C/cts_pre.tcl
if {[qb_env QB_POSTCTS 1]} { set P(PRE_ROUTE_TCL) $::QB_R6C/route_pre.tcl }
set P(MAX_UTIL)      [qb_env QB_MAX_UTIL 99]
set P(ANTENNA_CHECK) [qb_env QB_ANT_CHECK 1]
set P(ANTENNA_ITER)  [qb_env QB_ANT_ITER 0]
# QB_GRT_STOP 1: checkpoint db/grt.odb after global route and exit (post_grt.tcl); detailed route via run.sh dr
if {[qb_env QB_GRT_STOP 0]} { set P(POST_GRT_TCL) $::QB_R6C/post_grt.tcl }
