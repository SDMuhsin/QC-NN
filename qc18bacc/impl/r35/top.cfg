# R35 top config (results/r35.md) = impl/r14/top14.cfg with
#   netlist  $QC_BUILD/r35/top_r35.v (impl/r11/top_nl.py on the R35 chip partition)
#   views    QB11_ABS [$QC_BUILD/r35/abs]: real hub ring LEF + ETMs, act LEF (+ ETM or blk_lib budget), column r5b_blk
#   floor    impl/r14/fp14.py with QB14_HUBX 40 (hub at x 40: its column pins at x 860 + 390 c meet columns at 900 + 390 c)
#   SDC      impl/r35/top_sdc.tcl (R31 EMA case-analysis fix), period QB11_PER
#   route    QB_POSTCTS 1 (post-CTS setup / hold repair after the clock balancing), GRT per-layer adjustment QB15_GADJ_L,
#            POST_GRT impl/r35/top_post_grt.tcl (repair at GRT parasitics before db/grt.odb)
set ::env(QB11_ABS) [expr {[info exists ::env(QB11_ABS)] ? $::env(QB11_ABS) : "$::env(QC_BUILD)/r35/abs"}]
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r14/top14.cfg]
set ::env(QB14_HTAP_N) [qb_env QB14_HTAP_N 1]
set ::QB_R35 [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r35]
set P(NETLIST) [qb_env QB35_TOPV $::QC_BUILD/r35/top_r35.v]
set P(SDC)     $::QB_R35/top_sdc.tcl
if {[qb_env QB_GRT_STOP 0]} { set P(POST_GRT_TCL) $::QB_R35/top_post_grt.tcl }
if {[qb_env QB15_GADJ_L ""] ne "" && [info commands qb35t_gadj_orig] eq "" && [info commands set_global_routing_layer_adjustment] ne ""} {
    rename set_global_routing_layer_adjustment qb35t_gadj_orig
    proc set_global_routing_layer_adjustment {layers adj} {
        qb35t_gadj_orig $layers $adj
        foreach {l a} $::env(QB15_GADJ_L) { qb35t_gadj_orig $l $a; qc_log "r35: gadj $l $a (QB15_GADJ_L)" }
    }
}
