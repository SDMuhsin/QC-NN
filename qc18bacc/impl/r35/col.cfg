# R35 column config (results/r35.md) = impl/r5c/col.cfg (R5d run recipe) with
#   pins     impl/r35/col_pins.tcl: pins at the r5b_blk abstract positions (QB35_COLPINS), no repin (QB_REPIN 0)
#   route    impl/r35/col_route_pre.tcl: per-layer GRT adjustment QB15_GADJ_L; antenna repair (QB35_ANT_ITER [3]);
#            DR_END_ITER from QB_DR_ITER as before
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r5c/col.cfg]
set ::QB_R35 [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r35]
set P(PIN_TCL) $::QB_R35/col_pins.tcl
set P(PRE_CTS_TCL) ""
if {[qb_env QB_RT 1]} { set P(PRE_ROUTE_TCL) $::QB_R35/col_route_pre.tcl }
set P(ANTENNA_ITER) [qb_env QB35_ANT_ITER 3]
