# R11 P&R config of the hierarchical top (results/r11.md), for flow/tsmc65/pnr/run_pnr.sh via impl/r11/run.sh.
# = impl/r5b/chip.cfg (column views r5b_blk, ARM macro views, PDN, recipe) with
#   netlist  $QC_BUILD/r11/top_r11.v (impl/r11/top_nl.py: hub + act supply + 8 columns as black boxes)
#   SDC      impl/r11/top_sdc.tcl (period QB11_PER [1.85]; no DC SDC: the DC chip SDC names hub / act internals)
#   views    hub / act proxy LEF (act_lef.py: OBS M1-M7, top routes over them on M8 / M9 as over the columns) and budget
#            liberty (blk_lib.py), column ETM with insertion arcs (r5b_blk *_ins.lib) after impl/r7b/etm_fix.py (QB11_ETMFIX 1)
#   floor    impl/r11/fp11.py (<run>/mplace.tcl), chip IO pins impl/r11/pins.tcl
#   CTS      plain TritonCTS (-insertion_delay: only 2 clock nets traced and no clocked path in STA, R5b / r11_c);
#            proposal A (results/r8d.md) after CTS: impl/r11/propa.tcl moves each column clk pin up the tree to the net
#            ~QB11_INS [0.96 ns] earlier than the median top register clock (PRE_ROUTE hook route_pre.tcl)
#   route    GRT with -allow_congestion (impl/r9b/route_pre.tcl, QB_POSTCTS [0]); QB_GRT_STOP 1: checkpoint grt + exit
#            (impl/r9b/post_grt.tcl); DR in a fresh process (run.sh dr)
proc qb_env {n d} { return [expr {[info exists ::env($n)] ? $::env($n) : $d}] }
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r5b/chip.cfg]
set ::QB_R11 [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r11]
set ::QB_R9B [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r9b]
set ::QB_R6C [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r6c]
set _r $::QC_BUILD/r11
set P(NETLIST) $_r/top_r11.v
set P(SDC)     $::QB_R11/top_sdc.tcl
set _a [qb_env QB11_ABS $_r/abs]
set _ml {}
foreach l $P(MACRO_LEFS) { if {![string match *qb_col_blk* $l]} { lappend _ml $l } }
set P(MACRO_LEFS) [concat [list $::QC_BUILD/r5b_blk/qb_col_blk_ring.lef $_a/qb_hub.lef $_a/qb_act2_blk.lef] $_ml]
foreach c {ss tt ff} {
    set _l {}
    foreach l $P(MACRO_LIBS_$c) { if {![string match *qb_col_blk* $l]} { lappend _l $l } }
    set _cl [expr {[qb_env QB11_ETMFIX 1] ? "$_a/qb_col_blk_${c}_insfix.lib" : "$::QC_BUILD/r5b_blk/qb_col_blk_${c}_ins.lib"}]
    set P(MACRO_LIBS_$c) [concat [list $_cl $_a/qb_hub_$c.lib $_a/qb_act2_blk_$c.lib] $_l]
    # R46 opt-in QB46_ETMO <dir> (results/r46.md): OpenROAD reads <dir>/<same name> where present = the block ETM without
    # setup / hold checks on output pins (impl/r46/etmochk46.py; they crash rsz repair_timing -hold).  PT keeps the original.
    if {[qb_env QB46_ETMO ""] ne ""} { set P(MACRO_LIBS_$c) [lmap l $P(MACRO_LIBS_$c) { expr {[file exists [qb_env QB46_ETMO ""]/[file tail $l]] ? "[qb_env QB46_ETMO ""]/[file tail $l]" : $l} }] }
}
set P(PIN_TCL)       $::QB_R11/pins.tcl
set P(PLACE_DENSITY) [qb_env QB_DENS 0.55]
# QB11_ICG 1: impl/r9b/cts_pre.tcl (impl/r6c/icg.tcl ICG sizing + move to the sink centroid before CTS)
set P(PRE_CTS_TCL)   [expr {[qb_env QB11_ICG 0] ? "$::QB_R9B/cts_pre.tcl" : [qb_env QB11_CTS_PRE ""]}]
set P(CTS_ARGS)      [qb_env QB_CTS_ARGS {-balance_levels -sink_clustering_buffer CKBD4}]
set ::env(QB_POSTCTS) [qb_env QB_POSTCTS 0]
set P(PRE_ROUTE_TCL) $::QB_R11/route_pre.tcl
set P(GR_ADJUST)     [qb_env QB_GR_ADJ 0.25]
if {[info exists ::env(QB11_GR_ITER)]} { set P(GR_ITER) $::env(QB11_GR_ITER) }
if {[qb_env QB_GRT_STOP 0]} { set P(POST_GRT_TCL) $::QB_R11/post_grt.tcl }
