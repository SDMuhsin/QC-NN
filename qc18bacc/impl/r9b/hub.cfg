# P&R config of the south hub hard block qb_hub (results/r9b.md), for flow/tsmc65/pnr/run_pnr.sh.
# Netlist: $QC_BUILD/r9b/qb_hub.v (DC group of the r8a_rp chip netlist, impl/r9b/dc_part.tcl), SDC qb_hub.sdc +
# hub_io.tcl (impl/r9b/sdc.py: clock QB9_PER, per-class IO budget).  Floorplan impl/r9b/mplace9.py (-> <run>/mplace.tcl:
# the R8 south band as a block, chip x coordinates, die 3990 x H), pins impl/r9b/pins9.tcl (north edge: column pins
# straight below the column south pins, the rest over the west strip).  PDN / macro PDN as the chip (impl/r5b, no
# column-block grid).  Recipe: impl/r5b pre_place (max transition 0.4, remove_buffers, incremental gpl + 2nd DRV
# repair), gpl QB_DENS / QB_TD / QB_RD, ICG sizing + move (impl/r6c/icg.tcl) before CTS, post-CTS setup / hold repair
# (impl/pnr/slice_post_cts.tcl with the hub budget shifted by QB_IO_LAT), GRT, DR (QB_DR_ITER).
proc qb_env {n d} { return [expr {[info exists ::env($n)] ? $::env($n) : $d}] }
set ::QC_CORNERS [qb_env QB_CORNERS tt]
set ::QB_DIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr]
set ::QB_R5B [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r5b]
set ::QB_R6C [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r6c]
set ::QB_R9B [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r9b]
set ::QC_PNR_MAX_LAYER [qb_env QB9_MAX_LAYER M9]
set _w [qb_env QB9_W $::QC_BUILD/r9b]
set P(TOP) qb_hub
set P(NETLIST) $_w/qb_hub_c.v
# per-run SDC / IO budget (run.sh fp, sdc.py): $QC_BUILD/r9b/cfg_<tag>/ (the run dir is wiped by the init step)
set _sd $_w/cfg_[expr {[info exists ::env(QC_PNR_OUT)] ? [file tail $::env(QC_PNR_OUT)] : "none"}]
set P(SDC) $_sd/qb_hub.sdc
set _mdir [qb_env QB_MDIR /tmp/$::env(USER)/qcnn/macros]
array set _mc {ss ss_0p9v_125c tt tt_1p0v_25c ff ff_1p1v_m40c}
set P(MACRO_LEFS) {}
foreach m {qb_s_256x128m1 qb_b_128x128m1 qb_i_128x128m1 qb_p_240x144m2 qb_f_3232x128m8} {
    lappend P(MACRO_LEFS) $_mdir/$m/$m.lef
    foreach c {ss tt ff} { lappend P(MACRO_LIBS_$c) $_mdir/$m/${m}_$_mc($c)_syn.lib }
}
set P(MACRO_AUTO) 0
set P(MACRO_HALO) [list [qb_env QB_HALO 7.0] [qb_env QB_HALO 7.0]]
if {[info exists ::env(QC_PNR_OUT)] && [file exists $::env(QC_PNR_OUT)/mplace.tcl]} { source $::env(QC_PNR_OUT)/mplace.tcl }
set ::env(QB_PDN_BLK) 0
set P(PDN_TCL)       $::QB_R5B/pdn.tcl
set P(MACRO_PDN_TCL) $::QB_R5B/pdn_macro.tcl
set P(PIN_TCL)       $::QB_R9B/pins9.tcl
set P(PLACE_DENSITY) [qb_env QB_DENS 0.62]
set P(TIMING_DRIVEN) [qb_env QB_TD 1]
set P(ROUTABILITY_DRIVEN) [qb_env QB_RD 1]
set P(GPL_ARGS)      [qb_env QB_GPL_ARGS {}]
set P(PRE_PLACE_TCL) $::QB_R5B/pre_place.tcl
set P(PLACE_PAD)     0
set P(DPL_ARGS)      [qb_env QB_DPL_ARGS {}]
set P(MAX_UTIL)      [qb_env QB_MAX_UTIL 90]
set P(PRE_CTS_TCL)   $::QB_R9B/cts_pre.tcl
set P(CTS_ARGS)      [qb_env QB_CTS_ARGS {-balance_levels -sink_clustering_buffer CKBD4}]
set P(REPAIR_DESIGN) auto
set P(REPAIR_TIMING) 0
set ::env(QB_IO_BUDGET) $_sd/hub_io.tcl
set ::env(QB_RT_LOOPS) [qb_env QB_RT_LOOPS 1]
set P(PRE_ROUTE_TCL) $::QB_R9B/route_pre.tcl
set P(SETUP_MARGIN)  0.0
set P(HOLD_MARGIN)   0.02
set P(GR_ADJUST)     [qb_env QB_GR_ADJ 0.25]
if {[info exists ::env(QB9_GR_ITER)]} { set P(GR_ITER) $::env(QB9_GR_ITER) }
if {[qb_env QB_GRT_STOP 0]} { set P(POST_GRT_TCL) $::QB_R9B/post_grt.tcl }
set P(ANTENNA_ITER)  [qb_env QB_ANT_ITER 0]
set P(ANTENNA_CHECK) [qb_env QB_ANT_CHECK 1]
set P(DR_END_ITER)   [qb_env QB_DR_ITER 20]
set P(DR_ARGS)       [qb_env QB_DR_ARGS {}]
set P(DCAP)          0
set P(GDS)           0
