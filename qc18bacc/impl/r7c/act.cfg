# P&R config of the act-supply hard block qb_act2_blk (results/r7c.md), for flow/tsmc65/pnr/run_pnr.sh: the column
# slice recipe (impl/pnr/slice.cfg: DC SDC with QB_PNR_PERIOD rescale, TD gpl, DRV repair, CTS, post-CTS setup / hold
# repair slice_post_cts.tcl, GRT, DR) without the PE-band placement, plus
#   * die QB_W x QB_H core (5-um margin), QB_DENS target density (gpl -routability_driven QB_RD as slice.cfg, default 0)
#   * pins (pins.tcl): act east at column 0's act pins, S / map read south, the rest west
#   * PDN impl/hard/pe_pdn.tcl: M1 rails, M4 straps, M7 straps to the boundary = VDD / VSS pins (as the column)
#   * IO budget (budget.tcl) appended to the P&R SDC and, shifted by QB_IO_LAT, after CTS
set ::env(QB_TOP) [expr {[info exists ::env(QB_TOP)] ? $::env(QB_TOP) : "qb_act2_blk"}]
set ::env(QB_SYN) [expr {[info exists ::env(QB_SYN)] ? $::env(QB_SYN) : "r7c_act_tt_p1.65_topo"}]
if {![info exists ::env(QB_GPL_ARGS)]} { set ::env(QB_GPL_ARGS) {} }
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr/slice.cfg]
set ::QB7_DIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r7c]
set P(PIN_TCL)       $::QB7_DIR/pins.tcl
# incremental gpl re-spread + second DRV repair after the place step's DRV repair, density from the utilisation
# after the repair, DRV classes (gpl_incr2.tcl; without the re-spread the ~30 k repair buffers are legalised in place
# and detailed placement sits in diamond search, r7c_A)
set P(PRE_PLACE_TCL) $::QB7_DIR/gpl_incr2.tcl
set P(PRE_CTS_TCL)   {}
# QB7_DPL_ARGS: detailed_placement options (r7c_A4 / B4: DPL-0036 on 305 / 94 cells of the act-edge / S1 / S2 clumps
# with the default search window; e.g. {-max_displacement {500 500}})
set P(DPL_ARGS)      [qb_env QB7_DPL_ARGS {}]
set P(PDN_TCL)       [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/hard/pe_pdn.tcl]
set ::env(QB_IO_BUDGET) $::QB7_DIR/budget.tcl
if {[info exists P(SDC)] && [file exists $P(SDC)]} {
    source $::QB7_DIR/budget.tcl
    set _f [open $P(SDC)]; set _t [read $_f]; close $_f
    regexp -line {^create_clock .*-period ([0-9.]+)} $_t -> _per
    if {[string first "# r7c IO budget" $_t] < 0} {
        set _f [open $P(SDC) a]; puts $_f "\n# r7c IO budget (impl/r7c/budget.tcl), period $_per\n[qb7_io_lines $_per]"; close $_f
        # QB7_MAXTRAN: P&R max transition (ns) instead of the DC SDC's min(0.5, 0.1 P) (opt-in, results/r7c.md)
        if {[qb_env QB7_MAXTRAN ""] ne ""} { set _f [open $P(SDC) a]; puts $_f "set_max_transition [qb_env QB7_MAXTRAN 0.2] \[current_design\]"; close $_f }
        # QB7_MAXFO: P&R max fanout instead of the SDC's 16 (opt-in)
        if {[qb_env QB7_MAXFO ""] ne ""} { set _f [open $P(SDC) a]; puts $_f "set_max_fanout [qb_env QB7_MAXFO 16] \[current_design\]"; close $_f }
    }
}
