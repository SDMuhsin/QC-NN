# R5c step 1 (results/r5c.md): standalone placement of ONE PE of the R5a column netlist, as the template that
# impl/r5c/place.tcl tiles into the PE slot of that row.  For flow/tsmc65/pnr/run_pnr.sh with QC_PNR_TO=place.
#   * netlist: the R5a column netlist (QB_SYN), linked at the PE module of row QB_ROW
#     (qbc_pe_KB36_ACC_W20_CR1_PP1_<15 - row>: DC uniquified the 16 PEs; instance names inside the module are the
#     column's names minus the prefix u_core/g_r_<row>__g_c_0__u_pe/)
#   * core = the slot: QB_TILE_W x QB_TILE_ROWS rows (default 320 x 64 x 1.8 = 115.2 um, the column's PE band is
#     117.2 um), 2-um margin; pins on the sides of their column neighbours (impl/hard/pe_pins.tcl: act a west, BR
#     outputs c / nnw / ctl / t2 east, up / sh_in north, shd / sh_out south)
#   * SDC: clk at the P&R period QB_PNR_PERIOD (2.0 ns), IO delays 20 %, max transition 0.1 P (as slice.cfg)
#   * timing-driven gpl at density QB_TILE_DENS, no DRV repair (cell masters stay those of the column netlist, so
#     the template is legal when tiled at a 2-row / 1-site offset), DPL; then place_dump.tcl writes
#     <QC_PNR_OUT>/tile.txt: instance  x  y  orient (DBU, relative to the core origin)
set ::QC_CORNERS tt
proc qb_env {n d} { return [expr {[info exists ::env($n)] ? $::env($n) : $d}] }
set ::QB_DIR  [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr]
set ::QB_HDIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/hard]
set ::QB_CDIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r5c]
set _row [qb_env QB_ROW 0]
set P(TOP) qbc_pe_KB36_ACC_W20_CR1_PP1_[expr {15 - $_row}]
set P(SYN) [qb_env QB_SYN qb_col_blk_s20_tt_p1.65_topo]
set _s [expr {[file isdirectory $P(SYN)] ? $P(SYN) : "$::QC_BUILD/syn/$P(SYN)"}]
set P(NETLIST) $_s/qb_col_blk.v
if {[info exists ::env(QC_PNR_OUT)]} {
    set _p [qb_env QB_PNR_PERIOD 2.0]
    set _f [open $::env(QC_PNR_OUT)/pe_tile.sdc w]
    puts $_f "create_clock -name qb_clk -period $_p -waveform {0 [expr {0.5 * $_p}]} \[get_ports clk\]"
    puts $_f "set_input_delay -clock qb_clk [expr {0.2 * $_p}] \[delete_from_list \[all_inputs\] \[get_ports clk\]\]"
    puts $_f "set_output_delay -clock qb_clk [expr {0.2 * $_p}] \[all_outputs\]"
    puts $_f "set_max_transition [expr {min(0.5, 0.1 * $_p)}] \[current_design\]"
    puts $_f "set_load 0.01 \[all_outputs\]"
    close $_f
    set P(SDC) $::env(QC_PNR_OUT)/pe_tile.sdc
}
set _w [qb_env QB_TILE_W 320.0]
set _h [expr {[qb_env QB_TILE_ROWS 64] * 1.8}]
set m 2.0
set P(DIE_AREA)  [list 0 0 [expr {$_w + 2 * $m}] [expr {$_h + 2 * $m}]]
set P(CORE_AREA) [list $m $m [expr {$_w + $m}] [expr {$_h + $m}]]
set P(PLACE_DENSITY) [qb_env QB_TILE_DENS 0.80]
set P(TIMING_DRIVEN) 1
set P(ROUTABILITY_DRIVEN) 0
set P(PLACE_PAD)     0
set P(DPL_ARGS)      {}
set P(PIN_TCL)       $::QB_HDIR/pe_pins.tcl
set P(PDN_TCL)       $::QB_HDIR/pe_pdn.tcl
set P(PRE_PLACE_TCL) $::QB_CDIR/place_dump.tcl
set P(REPAIR_DESIGN) 0
set P(GDS)           0
