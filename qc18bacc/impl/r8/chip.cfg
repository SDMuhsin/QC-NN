# P&R config of R8 (results/r8.md): route shakedown of the r7h_rp netlist (QB_TOP_RSH 2 + QB_HEAD_PCOL 1) with the R6c
# floorplan (die 23.243 mm2, QB_SB 400 / QB_WAH 1980) and recipe (ICG, spread3 / snap3, MAX_UTIL 99, GRT stop / dr
# split) + the R7b constraint fixes (QB7_ETM_FIX: $QC_BUILD/r7b_blk ETMs, QB7_BLKLAT: blklat.tcl), i.e. impl/r7b/chip.cfg,
# with the netlist QB_SYN [r7h_rp] and the R8 groups (impl/r8/groups.py: S WA W N + P0..P7 = head pool slice c under
# column c; import list QB7_GROUPS from impl/r8/run.sh).
#   QB8_WA_TCL  hook for the R7c WA hard block: a Tcl file sourced last (add its LEF / libs / MACRO_PLACE to P());
#               use with QB8_WA_HARD 1 (groups.py drops the WA group) - not used in R8.
if {![info exists ::env(QB_SYN)]} { set ::env(QB_SYN) r7h_rp }
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r7b/chip.cfg]
set ::QB_R8 [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r8]
if {[info exists ::env(QB8_WA_TCL)] && $::env(QB8_WA_TCL) ne ""} { source $::env(QB8_WA_TCL) }
