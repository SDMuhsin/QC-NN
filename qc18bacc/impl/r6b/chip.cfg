# P&R config of the R6b full chip (results/r6b.md): impl/r5b/chip.cfg (block / macro views, PDN, CTS, route recipe)
# with the R6a narrow-host-port netlist (DC syn/r6a_hpw144: QB_HPW 144, QB_HEAD_FW 128), the R6b floorplan
# (impl/r6b/mplace.py -> <run>/mplace.tcl), chip IOs on the west edge next to the W group (pins.tcl), and group
# template placement (place.tcl: the top std cells of each R6a group placed standalone in the group's rectangle by
# impl/r6b/grp_place.tcl, imported FIRM; gpl only for the rest; DRV repair + incremental gpl with the groups FIRM).
set ::env(QB_SYN) [expr {[info exists ::env(QB_SYN)] ? $::env(QB_SYN) : "r6a_hpw144"}]
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r5b/chip.cfg]
set ::QB_R6B [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r6b]
set P(PIN_TCL)       $::QB_R6B/pins.tcl
set P(PRE_PLACE_TCL) $::QB_R6B/place.tcl
set P(PRE_CTS_TCL)   $::QB_R6B/cts_pre.tcl
