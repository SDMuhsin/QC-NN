# R14 P&R config of the hierarchical top (results/r14.md), for flow/tsmc65/pnr/run_pnr.sh via impl/r14/run.sh.
# = impl/r11/top.cfg (netlist top_r11.v, top SDC, column ETM views) with
#   views    impl/r14/abs14.py proxies in $QC_BUILD/r14/abs (QB11_ABS): hub 4030 wide (t2 pins on the column pin's M8
#            track, clk pin in the west strip), act 900 x 1970 with all control / read-port pins south
#   floor    impl/r14/fp14.py (<run>/mplace.tcl): act at the top of the west strip, sequencer + IOs in the gap below
#            (impl/r11/pins.tcl with QB11_IOGAP 1: chip IO pins on the gap's west edge)
#   place    impl/r14/pre_place14.tcl (block-only nets out of the placement repair) + impl/r5b/pre_place.tcl
#   CTS      impl/r14/cts14.tcl (PRE_CTS: scripted top clock skeleton + TritonCTS only on the leaf nets) and
#            impl/r14/bal14.tcl (PRE_ROUTE: insertion-aware balancing of block clk pins vs top flops)
#   route    GRT -allow_congestion (impl/r9b/route_pre.tcl, QB_POSTCTS 0), QB_GRT_STOP 1 -> impl/r14/post_grt14.tcl
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r11/top.cfg]
set ::QB_R14 [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r14]
set ::env(QB11_IOGAP) [qb_env QB11_IOGAP 1]
set P(PRE_PLACE_TCL) $::QB_R14/pre_place14.tcl
set P(PRE_CTS_TCL)   [qb_env QB14_CTS_PRE $::QB_R14/cts14.tcl]
set P(PRE_ROUTE_TCL) $::QB_R14/route_pre14.tcl
if {[qb_env QB_GRT_STOP 0]} { set P(POST_GRT_TCL) $::QB_R14/post_grt14.tcl }
