# R45 minimal repro (gen45.py netlist).  env R45_DIR (netlist dir), R45_LEF (router LEF, default kit), R45_NOMINCUT
# (layers whose MINIMUMCUT the flow drops, default {M1} = production).
set P(TOP) t45
set P(NETLIST) $::env(R45_DIR)/t45.v
set P(SDC) $::env(R45_DIR)/t45.sdc
set ::QC_CORNERS tt
set ::QC_PNR_MAX_LAYER M7
if {[info exists ::env(R45_LEF)]} { set ::QC_PNR_LEF $::env(R45_LEF) }
set ::QC_PNR_LEF_NO_MINCUT [expr {[info exists ::env(R45_NOMINCUT)] ? $::env(R45_NOMINCUT) : {M1}}]
set P(CORE_UTIL) 0.60
set P(REPAIR_DESIGN) 0
set P(REPAIR_TIMING) 0
set P(TIMING_DRIVEN) 0
set P(ANTENNA_ITER) 0
set P(GDS) 0
# R45_DBFIX 1: impl/r45/lef57db45.tcl as PRE_PLACE_TCL (LEF57 rules into the db tech before routing)
if {[info exists ::env(R45_DBFIX)] && $::env(R45_DBFIX)} { set P(PRE_PLACE_TCL) $::env(R45)/lef57db45.tcl }
