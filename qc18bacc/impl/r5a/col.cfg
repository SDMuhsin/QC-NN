# P&R config of the column hard block qb_col_blk (results/r5a.md), for flow/tsmc65/pnr/run_pnr.sh:
# the slice3 recipe (impl/pnr/slice3.cfg: strip QB_W x QB_H, band seed + TD gpl, DRV repair, QB_INC_POST re-spread,
# QB_REPIN 2, CTS, one setup + one hold repair each legalised, GRT, DR) with the block's own
#   * pins (pins.tcl): act west at the PE row bands, act_o east at exactly the same y / layer (abutment),
#     north cd / ctl / t2 / clk / rst_n, south parameter loads / lane streams / PPU controls / b2 (M2 / M4 / M6)
#   * PDN impl/hard/pe_pdn.tcl: M1 rails, M4 straps, M7 straps to the boundary = VDD / VSS block pins
#   * IO budget (budget.tcl) in the P&R SDC and, shifted by QB_IO_LAT, after CTS (slice_post_cts.tcl QB_IO_BUDGET)
set ::env(QB_TOP) [expr {[info exists ::env(QB_TOP)] ? $::env(QB_TOP) : "qb_col_blk"}]
set ::env(QB_SYN) [expr {[info exists ::env(QB_SYN)] ? $::env(QB_SYN) : "qb_col_blk_tt_p1.65_topo"}]
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/pnr/slice3.cfg]
set ::QB5_DIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r5a]
set P(PIN_TCL)     $::QB5_DIR/pins.tcl
set P(PDN_TCL)     [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/hard/pe_pdn.tcl]
set P(PRE_CTS_TCL) [expr {[qb_env QB_REPIN 0] ? "$::QB5_DIR/repin.tcl" : ""}]
set ::env(QB_IO_BUDGET) $::QB5_DIR/budget.tcl
if {[info exists P(SDC)] && [file exists $P(SDC)]} {
    source $::QB5_DIR/budget.tcl
    set _f [open $P(SDC)]; set _t [read $_f]; close $_f
    regexp -line {^create_clock .*-period ([0-9.]+)} $_t -> _per
    if {[string first "# r5a IO budget" $_t] < 0} {
        set _f [open $P(SDC) a]; puts $_f "\n# r5a IO budget (impl/r5a/budget.tcl), period $_per\n[qb5_io_lines $_per]"; close $_f
    }
}
