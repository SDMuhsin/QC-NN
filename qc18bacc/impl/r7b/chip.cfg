# P&R config of R7b (results/r7b.md): impl/r6c/chip.cfg (R6c recipe: ICG, spread3 / snap3, MAX_UTIL 99, GRT stop hooks)
# with
#   QB7_ETM_FIX [1]  column-block views from $QC_BUILD/r7b_blk (QB_BLK, unless set): the r5b_blk files with the tt / ss /
#                    ff P&R ETMs corrected by impl/r7b/etm_fix.py (one-edge extraction outliers, e.g. act[4071] hold
#                    rise 8.18 -> 0.93 ns, the source of R6c's -5.6-ns act hold violations)
#   PRE_PLACE_TCL / PRE_CTS_TCL impl/r7b/place.tcl / cts_pre.tcl: R6c hooks + QB7_BLKLAT (blklat.tcl: no -0.90-ns
#                    latency on the column clk pins from the first P&R step on) + group import of QB7_GROUPS
#                    (the column slices S0..S7 / SX of impl/r7b/slice.py instead of S)
if {[expr {[info exists ::env(QB7_ETM_FIX)] ? $::env(QB7_ETM_FIX) : 1}] && ![info exists ::env(QB_BLK)]} {
    set ::env(QB_BLK) $::QC_BUILD/r7b_blk
}
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r6c/chip.cfg]
set ::QB_R7B [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r7b]
set P(PRE_PLACE_TCL) $::QB_R7B/place.tcl
set P(PRE_CTS_TCL)   $::QB_R7B/cts_pre.tcl
# QB_GRT_STOP 1: impl/r7b/post_grt.tcl (path classes at GRT parasitics, then impl/r6c/post_grt.tcl)
if {[qb_env QB_GRT_STOP 0]} { set P(POST_GRT_TCL) $::QB_R7B/post_grt.tcl }
# QB7_GR_ITER: global_route -congestion_iterations (flow default 50; r6c_h ran with 3 - with 15 / 50 FastRoute was
# still in maze routing after 80 min, results/r6c.md)
if {[info exists ::env(QB7_GR_ITER)]} { set P(GR_ITER) $::env(QB7_GR_ITER) }
