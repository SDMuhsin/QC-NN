# P&R config of the R9a act-supply hard block qb_act2_blk (results/r9a.md): impl/r7c/act.cfg (slice recipe, PDN with M7
# PG pins, IO budget impl/r7c/budget.tcl shifted by QB_IO_LAT after CTS, QB7_MAXTRAN / QB7_MAXFO P&R DRV limits) with
#   * pins impl/r9a/pins.tcl: act east at column 0's act pins, S / map read port south, controls north
#   * PRE_PLACE_TCL impl/r9a/place.tcl: structured placement of the act output chains at their pins + gpl_incr2.tcl
#   * antenna repair after GRT (3 iterations) and check_antennas after DR
source [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r7c/act.cfg]
set ::QB9_DIR [file normalize $::env(QC_FLOW)/../../qc18bacc/impl/r9a]
set P(PIN_TCL)       $::QB9_DIR/pins.tcl
set P(PRE_PLACE_TCL) $::QB9_DIR/place.tcl
set P(ANTENNA_ITER)  [qb_env QB9_ANT_ITER 3]
set P(ANTENNA_CHECK) 1
if {[qb_env QB9_RT_ARGS ""] ne ""} { set P(PRE_ROUTE_TCL) $::QB9_DIR/post_cts.tcl }
